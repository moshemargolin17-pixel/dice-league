*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--page-ink);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:var(--bg);background-image:var(--bg-img);background-size:var(--bg-size);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pmuted{color:var(--page-muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink);border-bottom:var(--head-border-w) solid var(--head-border)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;text-transform:var(--h-case);letter-spacing:var(--h-track)}
html[data-design="chalk"] .brand h1{font-weight:400;font-size:28px}
html[data-design="app"] .brand h1{font-size:19px;font-weight:800}
.brand .sub{font-size:13px;color:var(--head-muted);margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{appearance:none;border:1px solid var(--nav-border);background:transparent;color:var(--nav-ink);font-family:var(--nav-font);font-size:14px;font-weight:600;letter-spacing:var(--nav-track);text-transform:var(--nav-case);padding:9px 14px;min-height:40px;border-radius:var(--nav-radius);cursor:pointer;box-shadow:inset 0 -3px 0 transparent}
html[data-design="arena"] .tab{font-weight:500;font-size:15px;border-color:transparent}
.tab:hover{color:var(--accent)}
.tab.on{background:var(--nav-on-bg);color:var(--nav-on-ink);box-shadow:inset 0 -3px 0 var(--nav-on-line);border-color:var(--nav-on-bg)}

main{padding-block:22px 140px}
.section{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:28px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.h2{margin:0;font-family:var(--f-display);font-weight:var(--h-weight);font-size:var(--h-size);text-transform:var(--h-case);letter-spacing:var(--h-track);line-height:1.1;text-wrap:balance}
.h3{margin:0;font-family:var(--f-display);font-weight:var(--h-weight);font-size:18px;text-transform:var(--h-case);letter-spacing:var(--h-track)}
html[data-design="app"] .h3{font-weight:800;font-size:16px}
.panel{background:var(--panel);color:var(--ink);border:var(--panel-border);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;min-width:0}
.cols{display:flex;flex-wrap:wrap;gap:16px}
.cols>*{flex:1 1 420px;min-width:0}

/* game cards */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.gcard{appearance:none;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:var(--panel-border);box-shadow:var(--shadow);border-radius:var(--radius);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.gcard:hover{filter:brightness(1.04)}
.gtop{display:flex;justify-content:space-between;gap:8px;padding:10px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gtop-bg)}
html[data-design="app"] .gtop{padding:8px 14px;letter-spacing:.02em}
.gcard.is-live .gtop{background:var(--gtop-live-bg)}
.gst{color:var(--muted)}
.gcard.is-live .gst{color:var(--live)}
.gst .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:1px}
.gmeta{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.gbody{padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px}
.gteam{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gname{min-width:0}
.gname b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname b.w{font-weight:700}
.gname small{display:block;font-size:12px;color:var(--muted)}
.sc{font-family:var(--f-num);font-weight:700;font-size:var(--sc-size);line-height:1.1;min-width:62px;text-align:right;padding:2px 10px;border-radius:var(--sc-radius);background:var(--sc-bg);font-variant-numeric:tabular-nums}
html[data-design="chalk"] .sc{font-weight:400;padding:0}
html[data-design="app"] .sc{padding:0;min-width:40px}
.sc.win{color:var(--sc-win);background:var(--sc-win-bg)}
.sc.lose{color:var(--sc-lose);background:var(--sc-lose-bg)}
.sc.live{color:var(--sc-live);background:var(--sc-live-bg)}
.sc.up{color:var(--sc-lose);background:var(--sc-lose-bg)}
.gfoot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}

/* record lists */
.rpanel{display:flex;flex-direction:column}
.rpanel.season{background:var(--season-bg);color:var(--season-ink)}
.rpanel.tonight{background:var(--tonight-bg);color:var(--tonight-ink)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--season-line)}
.rpanel.tonight .rrow{border-top-color:var(--tonight-line)}
.rrow .lab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--season-muted)}
html[data-design="app"] .rrow .lab{font-size:14px;letter-spacing:0;text-transform:none;color:var(--season-ink)}
.rpanel.tonight .rrow .lab{color:var(--tonight-muted)}
html[data-design="app"] .rpanel.tonight .rrow .lab{color:var(--tonight-ink)}
.rrow .who{font-size:14px}
html[data-design="app"] .rrow .who{color:var(--season-muted);font-size:13px}
html[data-design="app"] .rpanel.tonight .rrow .who{color:var(--tonight-muted)}
.rrow .val{font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--season-num);white-space:nowrap;font-variant-numeric:tabular-nums}
html[data-design="chalk"] .rrow .val{font-weight:400}
.rpanel.tonight .rrow .val{color:var(--tonight-num)}
.rrow.click{cursor:pointer}
.rrow.click:hover .who{text-decoration:underline}
.empty{padding:14px 0;color:inherit;opacity:.8;font-size:14px}

/* buttons */
.btn{appearance:none;border:2px solid transparent;border-radius:var(--radius);min-height:44px;padding:0 18px;font-family:var(--f-body);font-weight:700;font-size:15px;cursor:pointer;background:var(--panel-2);color:var(--ink);border-color:var(--border)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{min-height:52px;padding:0 26px;font-family:var(--f-display);font-size:17px;text-transform:var(--h-case);letter-spacing:var(--h-track)}
html[data-design="app"] .btn.big{font-weight:800}
html[data-design="chalk"] .btn.big{font-weight:400}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* day bar */
.daybar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--foot-bg);color:var(--foot-ink);border-top:1px solid var(--foot-border);padding-bottom:env(safe-area-inset-bottom,0px)}
.daybar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.daybar .status{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.daybar .left-note{font-size:14px}

/* tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:2px solid var(--line)}
.tbl td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl th.l,.tbl td.l{text-align:left}
.tbl tr.cut td{border-bottom:2px solid var(--accent)}
.tbl tr.cut2 td{border-bottom:2px dashed var(--muted)}
.tbl th.sort{cursor:pointer}
.tbl th.sort.on{color:var(--ink)}
.tbl .pname{font-weight:600;cursor:pointer}
.tbl .pname:hover{text-decoration:underline}
.seed{display:inline-block;min-width:22px;color:var(--muted);font-size:12px}
.mark{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;border:2px solid transparent}
.mark.po{background:var(--po-mark);border-color:var(--po-mark)}
.mark.pi{border-color:var(--pi-mark)}
.mark.out{border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:4px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);padding:8px 14px;min-height:38px;border-radius:calc(var(--radius) - 2px);font-weight:600;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pmuted .seg,.on-page .seg{color:var(--ink)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.tcard{appearance:none;text-align:left;background:var(--panel);color:var(--ink);border:var(--panel-border);box-shadow:var(--shadow);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .trow{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.pop{display:inline-flex;gap:2px;vertical-align:middle}
.pop i{width:6px;height:10px;border-radius:1px;background:var(--line)}
.pop i.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:calc(var(--radius) - 2px);padding:10px 12px;min-width:0}
.kv small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv strong{font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
html[data-design="chalk"] .kv strong{font-weight:400}
.backrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.series{background:var(--panel-2);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.series .sl{display:flex;justify-content:space-between;gap:8px}
.series .sl.won{font-weight:700}
.series .sl.lost{color:var(--muted)}
.series small{font-size:11px;color:var(--muted)}

/* settings */
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;font-size:15px;color:var(--input-ink);background:var(--input-bg);border:1px solid var(--input-border);border-radius:calc(var(--radius) - 2px);min-height:42px;padding:6px 10px;width:100%;min-width:0}
.tbl input,.tbl select{min-height:36px;padding:4px 8px;font-size:14px}
.tbl select[id^="psk"]{min-width:112px}
.tbl input.n{width:84px}
.tbl input.nm{min-width:140px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.theme{appearance:none;text-align:left;border:2px solid var(--border);border-radius:var(--radius);padding:0;overflow:hidden;cursor:pointer;background:var(--panel-2);color:var(--ink);display:flex;flex-direction:column}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.theme .sw{height:84px;display:flex;align-items:flex-end;gap:6px;padding:10px}
.theme .sw span{font-size:26px;line-height:1;padding:4px 8px;border-radius:4px}
.theme .tx{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.theme .tx b{font-size:15px}
.theme .tx small{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.banner{padding:12px 16px;border-radius:var(--radius);background:var(--panel);color:var(--ink);border:var(--panel-border);box-shadow:var(--shadow);font-size:14px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gut-l)}
.sheet{width:100%;max-width:720px;background:var(--panel);color:var(--ink);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:0}
.sheet .shd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet .sbd{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.xbtn{appearance:none;border:1px solid var(--border);background:var(--panel-2);color:var(--ink);width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.board .side{min-width:0}
.board .side.r{text-align:right}
.board .side b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .side small{color:var(--muted);font-size:12px}
.board .side small .sb-streak{display:inline;font-size:inherit;font-weight:700;color:var(--ink)}
.board .big{font-family:var(--f-num);font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--num)}
html[data-design="chalk"] .board .big{font-weight:400}
.board .mid{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.ls-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
.ls-row .linescore{margin:0}
.ls-ser{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.ls-ser small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ls-ser b{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.flow .section-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.flow-key{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.flow-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.flow-key .ka{background:#D2283C}.flow-key .kh{background:#1E9E4A}
.flowsvg{width:100%;height:auto;display:block}
.flowsvg .fa{fill:#D2283C;opacity:.28}.flowsvg .fh{fill:#1E9E4A;opacity:.3}
.flowsvg .fline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.flowsvg .f0{stroke:var(--muted);stroke-width:1}
.flowsvg .fq{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.flowsvg .fl{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle}
.possentry .epair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pside{border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.pside.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pside .elab{display:flex;align-items:baseline;gap:8px}
.pdice{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;align-items:center}
.pd{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.ptext{font-size:13.5px;color:var(--muted)}.ptext b{color:var(--ink)}
.ppad{margin-top:12px;display:grid;gap:8px}
.pask{font-size:15px}
.possentry .eacts .btn .kbd{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border:1px solid currentColor;border-radius:4px;font-size:11px;line-height:16px;opacity:.6}
@media (pointer:coarse){.possentry .eacts .btn .kbd{display:none}}
.pask .die{vertical-align:-1px}
.pslots.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.pslots.four .pslot{padding:8px;gap:6px}.pslots.four .ps-n{font-size:13.5px}
.pslot.small .ps-v{width:28px;height:28px;font-size:15px}
.pslot.wait{opacity:.55}
@media (max-width:560px){.pslots.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.play-cap{font:800 22px/1.25 var(--f-display);min-height:28px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 14px;text-align:center}
.play-cap .cap-who{padding-right:14px;border-right:2px solid var(--line)}
.play-cap .cw-a{color:#D2283C}.play-cap .cw-h{color:#178A3F}
/* 2.0 scoreboard: each score in its player's color, and the possession arrow */
.scoreboard .board .side:not(.r) .big{color:#D2283C}.scoreboard .board .side.r .big{color:#178A3F}
.poss-arrow{display:flex;justify-content:center;margin-top:8px}.poss-arrow svg{display:block}
.poss-arrow.pa-a path{fill:#D2283C}.poss-arrow.pa-h path{fill:#178A3F}
.play-cap .cap-what{color:var(--ink)}
@media (max-width:560px){.play-cap{font-size:18px;gap:10px}.play-cap .cap-who{padding-right:10px}}
.play-cap.cap-a{color:#D2283C}.play-cap.cap-h{color:#178A3F}
.play-cap.cap-pts{animation:cappop .35s ease-out}
@keyframes cappop{0%{transform:scale(1.12)}100%{transform:scale(1)}}
/* play-by-play */
.pbp ol{list-style:none;margin:8px 0 0;padding:0;max-height:340px;overflow:auto}
.pbp-full,.box-full{margin-top:16px}
.xtras{margin-top:16px;align-items:start}
.xtra .xtra-in{margin-top:10px}
.roll-details.xtra summary{justify-content:flex-start;gap:10px}
.xtra .xtra-in>.matchup-panel{border:0;padding:0;background:none}
.xtra .xtra-in .h3:first-child{display:none}.pbp-full ol{max-height:480px}
.game-aside .pbp{display:flex;flex-direction:column;min-height:0}.game-aside .pbp[style*=height] ol{flex:1;min-height:0;max-height:none}
.pbp li{display:grid;grid-template-columns:50px auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 2px;border-top:1px solid var(--line);font-size:13.5px}
.pbp li:first-child{border-top:0}
.pbp li.pbp-empty .pbp-x{color:var(--muted)}
.pbp .pbp-t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pbp li.pts .pbp-x{font-weight:700}
.pbp .pbp-s{font-variant-numeric:tabular-nums;color:var(--muted)}
.pbp li.pts .pbp-s{color:var(--ink);font-weight:700}
.pbp .pbp-w{font-weight:800;font-size:13px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}.pbp li.pbp-a .pbp-w{color:#D2283C}.pbp li.pbp-h .pbp-w{color:#178A3F}
.pbp li.pbp-empty{grid-template-columns:62px 1fr auto}
.pslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pslot{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 12px;border-radius:calc(var(--radius) - 2px);background:var(--panel);border:1px solid var(--border);font-weight:700}
.pslot.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pslot .die{margin:0;width:16px;height:16px;border-radius:4px;flex:none}.pslot .die.h3,.pslot .die.h4,.pslot .die.a3,.pslot .die.a4{width:12px;height:12px;border-radius:3px}
.pslot .ps-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pslot .ps-v{margin-left:auto;flex:none;width:36px;height:36px;font-size:18px;border-style:dashed}
.pslot .ps-v[class*=' h'],.pslot .ps-v[class*=' a']{border-style:solid}
@keyframes dieroll{0%{transform:rotate(0) scale(.88)}25%{transform:rotate(90deg) scale(1.06)}50%{transform:rotate(180deg) scale(.92)}75%{transform:rotate(270deg) scale(1.06)}100%{transform:rotate(360deg) scale(.88)}}
@keyframes dieland{0%{transform:scale(1.3)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.pslot .ps-v.rolling{animation:dieroll .28s linear infinite}
.pslot .ps-v.landed{animation:dieland .22s ease-out}
@keyframes dienudge{0%{transform:scale(1.12) rotate(0)}30%{transform:scale(1.06) rotate(-8deg)}60%{transform:scale(1.02) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.pslot .ps-v.nudge{animation:dienudge .28s ease-out}
@media (max-width:560px){.pslots{gap:8px}.pslot{padding:8px;font-size:14px;gap:5px}.pslot .die{width:12px;height:12px}.pslot .ps-n{white-space:normal;line-height:1.2;overflow:visible;flex:1;min-width:0;font-size:13px}.pslot .ps-v{width:30px;height:30px;font-size:16px}}
.pin{width:100%;min-height:46px;font:700 20px var(--f-num);text-align:center;letter-spacing:.04em}
.pin::placeholder{font:500 15px var(--f-body);letter-spacing:0}
@media (pointer:fine){.pin{display:none}}   /* a computer has number keys: no box needed */
.fbtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.ppad .chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.possentry .epair{grid-template-columns:1fr}}
.pgt{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.pgt td,.pgt th{padding:9px 6px;border-top:1px solid var(--line)}
.pgt tr:first-child td,.pgt tr:first-child th{border-top:0}
.pgt td{width:32%;font-weight:700;font-size:16px}
.pgt td:first-child{text-align:left}.pgt td:last-child{text-align:right}
.pgt th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center}
.pgt .pgn{font-size:13px;color:var(--muted)}
.live-stats .gstats{grid-template-columns:1fr}
.gstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;margin-top:8px}
.gstats>div{background:var(--panel-2);border-radius:calc(var(--radius) - 2px);padding:10px 12px;display:grid;gap:2px;align-content:start}
.gstats small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.gstats strong{font-size:18px}
.gstats .gfull{grid-column:1/-1}
.game-stats:not(.live-stats) .gstats{grid-template-columns:repeat(2,minmax(0,1fr))}
.boxscore.game-stats .gstats{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
@media (max-width:560px){.boxscore.game-stats .gstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* game screen: the season series lists every game, top to bottom */
.game-aside .season-series .sarrow,.game-aside .post-series .sarrow{display:none}
.game-aside .season-series .schips,.game-aside .post-series .schips{flex-direction:column;overflow:visible;gap:6px}
.sertabs{margin-bottom:12px}
.post-series .season-series{padding:0;border:0;box-shadow:none;background:none}
.game-aside .post-series .schip{flex:none!important;width:100%;min-width:0!important;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;text-align:left;padding:14px 16px;min-height:54px}
.game-aside .post-series .schip b{font-size:15px}
.game-aside .post-series .schip small,.game-aside .post-series .schip .sgs{font-size:13.5px;text-align:right}

<script>
/* ===== League logic (pure, no DOM) ===== */
const L = (() => {
  /* ---------- League shape ----------
     A season's shape: n players, c conferences (0 = one table, else 2), d divisions per conference (0 = none),
     how many times you play your division / the rest of your conference / the other conference, and the playoffs.
     Seasons saved before shapes existed have none and use DEFAULT_SHAPE, which is the league as it always was. */
  const DEFAULT_SHAPE = { n: 30, c: 2, d: 3, format: { div: 5, same: 3, other: 2 }, playoffs: { spots: 8, playIn: true } };
  let SH = DEFAULT_SHAPE, N = 30, C = 2, CS = 15, DS = 5, ND = 6;
  function normShape(x) {
    if (!x || !x.n) return DEFAULT_SHAPE;
    const f = x.format || {}, po = x.playoffs || {};
    return {
      n: x.n, c: x.c || 0, d: x.d || 0,
      format: { div: f.div || 0, same: f.same || 1, other: f.other || 0 },
      playoffs: { spots: po.spots || 0, playIn: !!(po.playIn && po.spots === 8) },
    };
  }
  function use(shape) {
    SH = normShape(shape);
    N = SH.n; C = Math.max(1, SH.c); CS = N / C;
    ND = SH.d ? SH.d * C : 0; DS = SH.d ? CS / SH.d : CS;
  }
  // Same players, groups and games as the original league (the playoffs can differ).
  const isDefaultSeason = () => SH.n === 30 && SH.c === 2 && SH.d === 3 && JSON.stringify(SH.format) === JSON.stringify(DEFAULT_SHAPE.format);
  const confOf = p => (C > 1 ? Math.floor(p / CS) : 0);
  const divOf = p => (SH.d ? Math.floor(p / DS) : confOf(p)); // with no divisions the conference stands in
  const hasDivs = () => SH.d > 0;
  const confCount = () => C;
  const divCount = () => ND;
  const shape = () => SH;
  const gamesPerPlayer = () => {
    const f = SH.format, conf = CS, div = SH.d ? DS : 0;
    return (SH.d ? (div - 1) * f.div + (conf - div) * f.same : (conf - 1) * f.same) + (C > 1 ? (N - conf) * f.other : 0);
  };
  // Seeds that go straight to the playoffs, and the last seed in the postseason (10 with a play-in).
  function lines() {
    const po = SH.playoffs;
    if (!po || !po.spots) return null;
    return { spots: po.spots, playIn: po.playIn, direct: po.playIn ? 6 : po.spots, post: po.playIn ? 10 : po.spots, divSeed: po.spots === 6 && SH.d > 0, hasDivs: SH.d > 0 };
  }

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function shuffle(arr, rand) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  /* ---------- Matchups: 2 vs other conf, 3 vs conf non-div, 5 vs div ---------- */
  function buildMatchupsDefault() {
    const pairs = []; // {x,y,games:[[away,home]...]}
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const g = [];

      const sharp = 0.5 + 0.15 * rating;
      const diff = side === 'h' ? h - a : a - h;
      if (len >= 24) {

        ['o', 'd'].forEach(t => {
          if (lf[t] > 0 && !taken(all, side, t, r)) { const c = { s: side, t, r, m: len, src: 'a', k: 'm' }; all.push(c); out.push(c); lf[t]--; }
        });
        ['f', 'x'].forEach(k => {
          if (lf[k] <= 0) return;
          let t = diff < 0 ? 'o' : 'd';
          if (taken(all, side, t, r)) t = t === 'o' ? 'd' : 'o';
          if (!taken(all, side, t, r)) { const c = { s: side, t, r, m: len, src: 'a', k }; all.push(c); out.push(c); }
        });

      }

      if (r >= 18 && Math.abs(diff) <= 6) W *= 1.25;

  /* ---------- race math ---------- */
  // rows: L.standings rows; remaining: count of remaining reg games per player
  // lines: { direct, post, playIn, divSeed } from the league's playoffs (default: 6 straight in, 7–10 play-in).
  // meet(p, q): regular-season games p and q still play each other. With it, a rival who can at best tie and
  // would lose the head-to-head tiebreaker (even winning every game left between them) can't pass, and the
  // same the other way. Only used when no third player could end on that same record (a 3-way tie is broken
  // among all of them).
  function raceMarks(rows, remaining, confOf, divOf, lines, meet) {
    const N = rows.length;
    const ln = lines || { direct: 6, post: 10, playIn: true, divSeed: false };
    const TOP = ln.direct, POST = ln.post;
    const W = rows.map(r => r.w), maxW = rows.map((r, p) => r.w + remaining[p]);
    const G = rows.map((r, p) => r.w + r.l + remaining[p]);
    const winsTie = (a, b) => { if (!meet) return false; const [w, l] = rows[a].h2h[b] || [0, 0]; return w > l + meet(a, b); };
    const third = (a, b, t) => { for (let x = 0; x < N; x++) if (x !== a && x !== b && confOf(x) === confOf(a) && W[x] <= t && t <= maxW[x]) return true; return false; };
    // q finishes above p however the rest goes / q could still finish above p
    const ahead = (q, p) => W[q] > maxW[p] || (W[q] === maxW[p] && G[q] === G[p] && winsTie(q, p) && !third(p, q, maxW[p]));
    const threat = (q, p) => maxW[q] > W[p] || (maxW[q] === W[p] && !(G[q] === G[p] && winsTie(p, q) && !third(p, q, W[p])));
    const res = [];
    for (let p = 0; p < N; p++) {
      const others = []; for (let q = 0; q < N; q++) if (q !== p && confOf(q) === confOf(p)) others.push(q);
      const above = K => others.filter(q => threat(q, p)).length < K;           // clinched top K
      const below = K => others.filter(q => ahead(q, p)).length >= K;           // can't make top K
      const divRivals = others.filter(q => divOf(q) === divOf(p));
      const m = {
        z: above(1), y: ln.hasDivs !== false && divRivals.length > 0 && divRivals.every(q => !threat(q, p)),
        X: above(TOP), PS: above(POST), out6: below(TOP), E: below(POST)
      };
      if (ln.divSeed) {
        // Top 6 with divisions: division winners take seeds 1–3, the next 3 records take 4–6.
        // Rivals who could still finish level or ahead, not counting decided division winners, can't push you past 6
        // unless there are 3 or more of them; and you're only out if you also can't win your division.
        const decided = q => others.filter(x => x !== q && divOf(x) === divOf(q)).concat(p !== q && divOf(p) === divOf(q) ? [p] : [])
          .every(x => !threat(x, q));
        const threats = others.filter(q => threat(q, p) && !decided(q)).length;
        const canWinDiv = divRivals.every(q => !ahead(q, p));
        m.X = m.y || above(3) || threats < 3;
        m.E = below(TOP) && !canWinDiv;
        m.out6 = m.E;
      }
      m.PI = !!ln.playIn && m.PS && m.out6;
      if (!ln.playIn) m.PS = m.X;
      // magic numbers (own wins + chaser losses) vs the K-th best chaser by max wins
      const magic = K => {
        if (above(K)) return null;
        const ch = others.slice().sort((x, y) => maxW[y] - maxW[x])[K - 1];
        return { n: maxW[ch] + 1 - W[p], vs: ch };
      };
      // elimination number vs the 10th-best current record (own losses + their wins)
      const elim = K => {
        if (below(K)) return null;
        const ch = others.slice().sort((x, y) => W[y] - W[x])[K - 1];
        return { n: maxW[p] - W[ch] + 1, vs: ch };
      };
      m.mag = { 1: magic(1), [TOP]: magic(TOP), [POST]: magic(POST) };
      m.el = { [TOP]: elim(TOP), [POST]: elim(POST) };
      m.top = m.z ? 'z' : ln.divSeed && m.y ? 'y' : m.X ? 'X' : m.PI ? 'PI' : ln.playIn && m.PS ? 'PS' : m.E ? 'E' : null;
      res.push(m);
    }
    return res;
  }
  return {
    RULES_V1, RULES_V2, RULES_V3, RULES_V4, RULES_V5, RULES_V6, RULES_V7, rulesOf, openCalls, edge, allowance, used, left, canCall, taken,

    const dd = dayDoc(g.day);
    const prev = dd.games[g.id] || {};
    const entry = Object.assign({}, prev);
    const flat = []; rolls.forEach(r => flat.push(r[0], r[1]));
    entry.r = flat;
    if (entry.p) { if (opts.edited) delete entry.p; else entry.p = entry.p.slice(0, rolls.length); }   // possession dice stay in step with the rolls
    if (entry.d && (opts.edited || entry.d.n !== rolls.length)) delete entry.d;   // possessions in progress belong to the next roll only
    if (entry.c) entry.c = entry.c.filter(c => c.m <= rolls.length);
    if (entry.ae != null && entry.ae > rolls.length) entry.ae = rolls.length;   // calls already decided at this point are kept, so don't decide them twice
    const st = L.gameState(rolls, D.ru);
    if (st.final) {
      entry.fin = true;
      entry.finAt = prev.fin ? prev.finAt : Date.now();
      if (!prev.fin && S.season.day.active && g.day === S.season.day.cur) { S.season.day.lastFinalAt = Date.now(); saveSeason(); }
      if (D.ru.adv && !entry.ln && !opts.noLearn) {
        ['a', 'h'].forEach(side => { const p = side === 'a' ? g.a : g.h; P(p).rh = E.learn(P(p).rh, rolls, entry.c, side); });
        entry.ln = true; saveCfg();
      }
    } else { delete entry.fin; delete entry.finAt; if (!opts.keepAtt) delete entry.att; }
    if (!rolls.length && !(entry.c && entry.c.length) && !opts.keep) delete dd.games[g.id];
    else dd.games[g.id] = entry;
    saveDay(g.day, st.final ? 0 : 250);
    refresh();
  }
  const facesOf = () => D.ru.faces;
  function validPts(v) {
    const f = facesOf();
    if (!Number.isInteger(v)) return false;
    return f ? f.includes(v) : v >= 0 && v <= 99;
  }
  function logRoll() {
    const g = D.byId[S.sheet.gid];
    if (!g || !editable(g) || g.st.final) return;
    if (D.ru.poss) {
      const now = possNow(g);
      if (now.side) { toast('Finish both possessions first.'); return; }
      possLog(g, [now.dr.a, now.dr.h]);
      const ng = D.byId[g.id];
      renderSheet(); render();
      if (ng.st.final) toast('Final: ' + pname(ng.a) + ' ' + ng.st.a + ', ' + pname(ng.h) + ' ' + ng.st.h);
      else if (ng.st.n === 24) toast('Tied after regulation. Overtime!');
      return;
    }
    const ia = document.getElementById('rollA'), ih = document.getElementById('rollH');
    const va = (ia.value || '').trim(), vh = (ih.value || '').trim();
    if (va === '' || vh === '') { toast('Enter both dice first.'); return; }
    const a = Number(va), h = Number(vh);
    if (!validPts(a) || !validPts(h)) { toast(facesOf() ? 'Each die counts 0, 2, 3, 4, 5 or 6 (a rolled 1 counts as 0).' : 'Enter points from 0 to 99 for each side.'); return; }
    const entry = ensureEntry(g);
    runAuto(entry, g, g.rolls);           // make sure calls for this point were decided
    const rolls = g.rolls.concat([[a, h]]);
    entry.r = []; rolls.forEach(r => entry.r.push(r[0], r[1]));
    runAuto(entry, g, rolls);             // decide calls for the roll that is coming up
    setRolls(g, rolls, { keep: true });
    const ng = D.byId[g.id];
    renderSheet();
    render();
    if (ng.st.final) toast('Final: ' + pname(ng.a) + ' ' + ng.st.a + ', ' + pname(ng.h) + ' ' + ng.st.h);
    else if (ng.st.n === 24) toast('Tied after regulation. Overtime!');
    const na = document.getElementById('rollA'); if (na) na.focus();
  }
  function undoRoll() {
    const g = D.byId[S.sheet.gid];
    if (!g || !editable(g) || !g.rolls.length || g.st.final) return;
    setRolls(g, g.rolls.slice(0, -1), { keep: true });
    renderSheet(); render();
  }
  function readyCheck() {
    const a = document.getElementById('rollA'), h = document.getElementById('rollH'), b = document.getElementById('logBtn');
    if (b && a && h) b.classList.toggle('ready', a.value !== '' && h.value !== '');
  }
  function setMode(md) {
    const g = D.byId[S.sheet.gid];
    if (!g || !editable(g)) return;
    const e = ensureEntry(g);
    e.md = md;
    if (md === 'a') { e.ae = null; runAuto(e, g, g.rolls); }
    saveDay(g.day, 250); refresh(); renderSheet();
  }
  function manualCall(side, kind, type, r) {
    const g = D.byId[S.sheet.gid];
    if (!g || !editable(g) || g.st.final) return;
    const e = ensureEntry(g);
    const lf = E.left(e.al, e.c, side);
    const pool = kind === 'x' ? 'x' : kind === 'f' ? 'f' : type;
    if (lf[pool] <= 0) { toast('No calls of that kind left.'); return; }
    const cr = callRulesOf(g);
    if (!E.canCall(g.st.n, r, cr)) { toast(cr.lead ? 'Too soon. Once the game starts, calls need ' + cr.lead + ' rolls of notice (next roll in overtime).' : 'That roll has already happened. Pick the next roll or later.'); return; }
    if (E.taken(e.c, side, type, r)) { toast('That roll already has that call.'); return; }
    e.c.push({ s: side, t: type, r, m: g.st.n, src: 'm', k: kind });
    saveDay(g.day, 250); refresh(); S.sheet.call = null; renderSheet();
    toast('Called: roll ' + (r + 1) + '.');
  }
  function cancelCall(idx) {
    const g = D.byId[S.sheet.gid];
    if (!g || !editable(g)) return;
    const e = ensureEntry(g);
    const c = e.c[idx];
    if (!c || c.r < g.st.n) return;
    e.c.splice(idx, 1);
    saveDay(g.day, 250); refresh(); renderSheet();
  }
  // edit a finished (or any logged) game directly
  function saveEdit() {
    const g = D.byId[S.sheet.gid];
    if (!g || !S.sheet.edit) return;
    const rows = [];
    for (let i = 0; i < S.sheet.edit.length; i++) {
      const a = Number(document.getElementById('ea' + i).value), h = Number(document.getElementById('eh' + i).value);
      if (!validPts(a) || !validPts(h)) { toast('Roll ' + (i + 1) + ' has a number that can’t be rolled.'); return; }
      rows.push([a, h]);
    }
    const st = L.gameState(rows, D.ru);
    const liveToday = S.season.day.active && g.day === S.season.day.cur;
    if (!st.final && !liveToday) { toast(st.n >= 24 && st.a === st.h ? 'That ends tied. Add overtime rolls until someone wins.' : 'The game needs to end with a winner (24 rolls, or full overtimes).'); return; }
    setRolls(g, rows, { keep: true, noLearn: true, keepAtt: true, edited: true });   // hand-edited scores drop the saved possession dice
    S.sheet.edit = null;
    renderSheet(); render();
    toast('Game updated. Standings and stats are recalculated.');
  }

  /* ---------- clinch marks and scenarios ---------- */
  function remainingOf(d) {
    const rem = Array(L.N).fill(0);
    d.reg.forEach(g => { if (!g.st.final) { rem[g.a]++; rem[g.h]++; } });
    return rem;
  }
  // how many of these games two players play each other: meet(p, q)
  function meetingsOf(games) {
    const n = {};
    games.forEach(g => { const k = Math.min(g.a, g.h) + '-' + Math.max(g.a, g.h); n[k] = (n[k] || 0) + 1; });
    return (p, q) => n[Math.min(p, q) + '-' + Math.max(p, q)] || 0;
  }
  const marksCache = {};
  function marksOf(d) {
    d = d || D;
    const key = d.season.n + ':' + d.reg.filter(g => g.st.final).length + ':' + d.reg.filter(g => g.st.final).reduce((s, g) => s + g.st.a * 3 + g.st.h, 0);
    if (marksCache[d.season.n] && marksCache[d.season.n].key === key) return marksCache[d.season.n].m;
    const m = E.raceMarks(d.rows, remainingOf(d), L.confOf, L.divOf, L.lines(), meetingsOf(d.reg.filter(g => !g.st.final)));
    marksCache[d.season.n] = { key, m };
    return m;
  }
  // Clinch marks and the playoff format, worded for this league's playoffs.
  const LINES0 = { spots: 8, playIn: true, direct: 6, post: 10, divSeed: false };
  const linesNow = () => L.lines() || LINES0;
  function markTexts() {
    const ln = linesNow();
    return {
      z: 'Clinched the #1 seed', y: 'Clinched the division', X: 'Clinched the playoffs (top ' + ln.direct + ')',
      PI: 'Locked into the play-in (7–10)', PS: 'Clinched the postseason (top ' + ln.post + ')', E: 'Eliminated',
    };
  }
  const MARK_TXT = new Proxy({}, { get: (_, k) => markTexts()[k] });
  const MARK_SHORT = () => {
    const ln = linesNow();
    return { z: '#1 seed', y: 'Won division', X: 'Playoffs (top ' + ln.direct + ')', PI: 'Play-in (7–10)', PS: 'Postseason (top ' + ln.post + ')', E: 'Eliminated' };
  };
  const markKeys = () => { const ln = linesNow(); return ['z', ...(ln.divSeed ? ['y'] : []), 'X', ...(ln.playIn ? ['PI', 'PS'] : []), 'E']; };
  function playoffText() {
    const ln = L.lines();
    if (!ln) return 'This league has no playoffs.';
    const two = L.confCount() > 1, per = two ? ' in each conference' : '';
    const fin = two ? ' The conference champions meet in the Finals, best of 7.' : '';
    const home = ' The higher seed hosts games 1, 2, 5 and 7 of a best of 7, games 1, 2 and 5 of a best of 5, and games 1 and 3 of a best of 3.';
    if (ln.spots === 4) return 'The top 4' + per + ' make the playoffs: 1 plays 4 and 2 plays 3, best of 3, and the winners meet, best of 5.' + fin + home;
    if (ln.spots === 6) return 'The top 6' + per + ' make the playoffs.' + (ln.divSeed ? ' Division winners take seeds 1–3 in order of record; the next 3 best records take seeds 4–6.' : '') +
      ' Seeds 1 and 2 get a bye while 3 plays 6 and 4 plays 5, best of 3. Then 1 plays the 4–5 winner and 2 plays the 3–6 winner, best of 5, and those winners meet, best of 7.' + fin + home;
    return (ln.playIn ? 'The top 10' + per + ' make the postseason. Seeds 1–6 go straight to the playoffs; 7–10 play a play-in (single games) for the last two spots.' : 'The top 8' + per + ' make the playoffs.') +
      ' 1 plays 8, 4 plays 5, 3 plays 6 and 2 plays 7, and every round is best of 7.' + fin + home;
  }
  function markChips(p, d) {
    const m = marksOf(d)[p];
    const out = [];
    if (m.z) out.push('z');
    else {
      if (m.top) out.push(m.top);
    }
    return out.map(k => '<span class="cl cl-' + k + '" title="' + MARK_TXT[k] + '">' + k + '</span>').join('');
  }
  // tonight's clinch / elimination scenarios (regular season)
  let scenCache = null;
  function scenarios(day) {
    if (!isCur()) return [];
    const fins = D.reg.filter(g => g.st.final);
    const key = S.season.n + ':' + day + ':' + fins.length + ':' + fins.reduce((s, g) => s + g.st.a * 3 + g.st.h, 0);
    if (scenCache && scenCache.key === key) return scenCache.v;
    const v = scenariosRaw(day);
    scenCache = { key, v };
    return v;
  }
  function scenariosRaw(day) {
    const d = D;
    if (!isCur() || d.season.phase !== 'reg') return [];
    const todays = d.reg.filter(g => g.day === day && !g.st.final);
    if (!todays.length) return [];
    const rows = d.rows, rem = remainingOf(d);
    const left = d.reg.filter(g => !g.st.final);
    const base = E.raceMarks(rows, rem, L.confOf, L.divOf, L.lines(), meetingsOf(left));
    const playing = new Set(); const oppOf = {};
    todays.forEach(g => { playing.add(g.a); playing.add(g.h); oppOf[g.a] = g.h; oppOf[g.h] = g.a; });
    // apply a set of results {p: 'w'|'l'} and get marks
    const marksWith = res => {
      const r2 = rows.map(r => Object.assign({}, r)); const rem2 = rem.slice();
      Object.keys(res).forEach(k => {
        const p = +k, o = oppOf[p]; rem2[p]--; if (res[k] === 'w') r2[p].w++; else r2[p].l++;
        const h = (r2[p].h2h = Object.assign({}, r2[p].h2h))[o] = (r2[p].h2h[o] || [0, 0]).slice();
        h[res[k] === 'w' ? 0 : 1]++;
      });
      // the games decided here are no longer left to play
      const played = left.filter(g => g.day === day && res[g.a] != null && res[g.h] != null);
      return E.raceMarks(r2, rem2, L.confOf, L.divOf, L.lines(), meetingsOf(left.filter(g => !played.includes(g))));
    };
    const out = [];
    const goals = [['z', 'clinches the #1 seed'], ['X', 'clinches the playoffs'], ['PS', 'clinches a postseason spot']];
    [...playing].forEach(p => {
      const o = oppOf[p];
      for (const [k, txt] of goals) {
        if (base[p][k]) continue;
        const withWin = marksWith({ [p]: 'w', [o]: 'l' })[p][k];
        let helper = null;
        for (const q of playing) {
          if (q === p || q === o || L.confOf(q) !== L.confOf(p)) continue;
          if (marksWith({ [q]: 'l', [oppOf[q]]: 'w' })[p][k]) { helper = q; break; }
        }
        if (withWin && helper != null) { out.push('<b>' + esc(pname(p)) + '</b> ' + txt + ' with a win or a <b>' + esc(pname(helper)) + '</b> loss.'); break; }
        if (withWin) { out.push('<b>' + esc(pname(p)) + '</b> ' + txt + ' with a win.'); break; }
        if (helper != null) { out.push('<b>' + esc(pname(p)) + '</b> ' + txt + ' if <b>' + esc(pname(helper)) + '</b> loses.'); break; }
      }
      if (!base[p].E && marksWith({ [p]: 'l', [o]: 'w' })[p].E) out.push('<b>' + esc(pname(p)) + '</b> is eliminated from the postseason with a loss.');
      else if (!base[p].out6 && marksWith({ [p]: 'l', [o]: 'w' })[p].out6 && !base[p].E) out.push('<b>' + esc(pname(p)) + '</b> drops out of the top-' + linesNow().direct + ' race with a loss.');
    });
    return out.slice(0, 10);
  }
  // record clinch/elimination changes into the season log
  function logMarks(before, after, day) {
    const s = S.season; s.log = s.log || [];
    for (let p = 0; p < L.N; p++) ['z', 'X', 'PS', 'PI', 'E'].forEach(k => {
      if (after[p][k] && !before[p][k]) s.log.push({ day, p, k });
    });
  }

  /* ---------- records ---------- */
  function vsLine(g) { return nm(g.pa) + ' vs ' + nm(g.ph); }
  function gameRecords(list) {
    const fin = list.filter(g => g.st.final);
    const pick = (fn) => fin.reduce((b, g) => (b == null || fn(g) > fn(b) ? g : b), null);
    return { fin, pick };
  }
  const winId = g => (g.st.a > g.st.h ? g.pa : g.ph), loseId = g => (g.st.a > g.st.h ? g.ph : g.pa);
  function winLoseLine(g) { return nm(winId(g)) + ' over ' + nm(loseId(g)); }
  function nightRecords(list) {
    const { fin, pick } = gameRecords(list);
    if (!fin.length) return [];
    const out = [];
    const hs = pick(g => Math.max(g.st.a, g.st.h));
    out.push({ label: 'Top score', who: nm(winId(hs)), value: Math.max(hs.st.a, hs.st.h), gid: hs.id });
    const bw = pick(g => Math.abs(g.st.a - g.st.h));
    out.push({ label: 'Biggest win', who: winLoseLine(bw), value: '+' + Math.abs(bw.st.a - bw.st.h), gid: bw.id });
    const cl = pick(g => -Math.abs(g.st.a - g.st.h));
    out.push({ label: 'Closest game', who: vsLine(cl), value: Math.abs(cl.st.a - cl.st.h), gid: cl.id });
    return out;
  }

  /* ---------- rendering helpers ---------- */
  const confName = c => (L.confCount() > 1 ? esc(S.cfg.confNames[c] || (c ? 'West' : 'East')) : esc(S.cfg.leagueName));
  const divName = d => esc(S.cfg.divNames[d] || 'Division ' + (d + 1));
  function teamLabel(p, g) {
    const sd = g && g.type !== 'reg' ? (g.type === 'playin' ? origSeed(p) : seedOf(p)) : null;
    return (sd ? '(' + sd + ') ' : '') + esc(pname(p));
  }
  const teamLink = (p, g) => '<button type="button" class="teamlink" data-act="team" data-p="' + pid(p) + '" data-n="' + D.season.n + '">' + teamLabel(p, g) + '</button>';
  // what kind of game: Division, Conference or Interconference (in the playoffs, the conference)
  function gameKind(g) {
    if (g.sid) { const x = findSeries(g.sid); return x && x.conf < 2 && L.confCount() > 1 ? confName(x.conf) : ''; }
    if (L.hasDivs() && L.divOf(g.a) === L.divOf(g.h)) return 'Division';
    if (L.confCount() > 1) return L.confOf(g.a) === L.confOf(g.h) ? 'Conference' : 'Interconference';
    return '';
  }
  // 2.0: points from possessions that are in but whose roll isn't logged yet (the score updates after each possession)
  function possLive(g) {
    const z = { a: 0, h: 0 };
    const dr = D.ru.poss && !g.st.final ? possSaved(g) : null;
    if (!dr) return z;
    const wa = possWalk(dr.a, possFast(g, g.st.n, 'a'), possTy(g, 'a'), possTy(g, 'h'), possEdge(g, 'a'));
    if (wa.done) { z.a = wa.pts; const wh = possWalk(dr.h, possFast(g, g.st.n, 'h', dr.a), possTy(g, 'h'), possTy(g, 'a'), possEdge(g, 'h')); if (wh.done) z.h = wh.pts; }
    return z;
  }
  function gameCard(g) {
    const st = g.st, live = st.live, fin = st.final, lv = possLive(g);
    const score = (p, side) => '<div class="gteam"><div class="gname">' + teamLink(p, g) + '<small>' + recLine(g, p) + '</small></div><span class="sc ' + (fin ? (st[side] > st[side === 'a' ? 'h' : 'a'] ? 'win' : 'lose') : live ? 'live' : 'up') + '">' + (st.n || lv.a || lv.h ? st[side] + lv[side] : '–') + '</span></div>';
    let foot = '';
    if (g.sid) {
      const x = findSeries(g.sid);
      foot = '<div class="gfoot">' + esc(roundName(x.round)) + (x.bo > 1 ? ' · Game ' + g.no + ' · ' + seriesText(x, seriesAt(x, g)) : '') + '</div>';
    }
    return '<article class="gcard' + (live ? ' is-live' : '') + '" data-act="game" data-n="' + D.season.n + '" data-id="' + g.id + '" tabindex="0" role="button" aria-label="Open ' + esc(vsLine(g)) + '">' +
      '<div class="gtop"><span class="gst">' + (live ? '<span class="dot" aria-hidden="true"></span>' : '') + (st.n ? esc(st.short) : tip(esc(st.short))) + '</span><span class="gmeta">' + gameKind(g) + '</span></div>' +
      '<div class="gbody">' + score(g.a, 'a') + score(g.h, 'h') + foot + '</div></article>';
  }
  function recPanel(title, cls, list, emptyMsg) {
    return '<div class="panel rpanel ' + cls + '"><div class="shead" style="margin-bottom:8px"><h2 class="h3">' + title + '</h2></div>' +
      (list.length ? list.map(r => '<div class="rrow' + (r.gid ? ' click' : '') + '"' + (r.gid ? ' data-act="game" data-n="' + D.season.n + '" data-id="' + r.gid + '"' : '') + '><div style="min-width:0"><div class="lab">' + esc(r.label) + '</div><div class="who">' + esc(r.who) + '</div></div><div class="val">' + esc(r.value) + '</div></div>').join('')
        : '<div class="empty">' + esc(emptyMsg) + '</div>') + '</div>';
  }

  /* ---------- tips: how-it-works notes on the pages, shown for the first 10 game days; Settings → Help keeps all of them ---------- */
  const TIP_DAYS = 10;
  // Skill is shown as stars, 5 best. The saved level keeps its old meaning (1 = best), so stars = 6 - level
  // and existing leagues keep the same players and the same advantages.
  const starsOf = level => 6 - level;
  const starText = level => '★'.repeat(starsOf(level)) + '☆'.repeat(5 - starsOf(level));
  const starWord = level => starsOf(level) + (starsOf(level) === 1 ? ' star' : ' stars');
  const SKILL_LEVELS = [1, 2, 3, 4, 5]; // best first: 5 stars down to 1 star
  // 2.0 ratings are stored as stars (5 best): options from 5 stars down to 1
  const ratingSel = (id, v, label) => '<select id="' + id + '" class="rsel" aria-label="' + label + '">' + [5, 4, 3, 2, 1].map(n => '<option value="' + n + '"' + (v === n ? ' selected' : '') + ' aria-label="' + n + (n === 1 ? ' star' : ' stars') + '">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</option>').join('') + '</select>';
  const typeSel = (id, v, label, off) => '<select id="' + id + '" aria-label="' + label + '"' + (off ? ' disabled title="Locked until the season is over"' : '') + '>' + Object.entries(PTYPES).map(([k, t]) => '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>';
  const RATINGS_TIP = 'Offense and Defense are in stars, 5 is best. The shooter’s Offense against the other player’s Defense sets which die 2 numbers are makes: 4–5 when within 1 star, 3–5 when 2 stars better, 2–5 when 3 or more better, and 5 only when 2 or more worse. Type decides which shots are 3-pointers on die 1 (a Guard on 5 or 6, a Forward on 6, a Center never) and rebounds: Guards get no offensive rebounds and putback only on a 6; Forwards rebound on 2 (2–3 against a Guard) and putback on 5–6; Centers rebound on 2–3 and putback on 4–6. Guard against Guard and Center against Center use the regular rules (2, putback 5–6). Types are set before a season begins and can’t change until it’s over.';
  const skillCallsText = ru => ru.skillOdd
    ? 'The better player gets 1 call for a gap of 1 star (2 calls for 3 stars vs 2 stars), 3 for a gap of 2, 5 for a gap of 3 and 6 for a gap of 4.'
    : 'The better player gets ' + ru.skillCalls.slice(1, 4).join(', ') + ' or ' + ru.skillCalls[4] + ' calls for a gap of 1, 2, 3 or 4 stars.';
  const homeCallsText = ru => 'The home player gets ' + (ru.homeCalls || 0) + ' extra call' + (ru.homeCalls === 1 ? '' : 's') + (ru.homeCallsFav != null ? ' (' + ru.homeCallsFav + ' if the home player is the better player)' : '') + '.' + (Array.isArray(ru.maxCalls) ? ' No player gets more than ' + ru.maxCalls[0] + ' calls in a game (' + ru.maxCalls[4] + ' when 4 levels better).' : ru.maxCalls ? ' No player gets more than ' + ru.maxCalls + ' calls in a game.' : '');
  const TIPS = {
    get skill() { return 'Skill is in stars: 5 stars is best, 1 star is weakest. ' + skillCallsText(S.season.rules || E.RULES_V3) + ' Equal skills get no skill calls. ' + homeCallsText(S.season.rules || E.RULES_V3) + ' Each call can be offense or defense. Changes apply to games not yet started.'; },
  };
  function tipsOn() {
    if (S.cfg.seasons.length > 1) return false;
    const cur = S.season.day.cur;
    return Object.values(S.days).filter(d => d.day < cur && Object.values(d.games || {}).some(x => x.fin)).length < TIP_DAYS;
  }
  const tip = html => (tipsOn() ? html : '');
  function cleanHints(root) {
    if (!root || tipsOn()) return;
    root.querySelectorAll('.note, .empty, [data-hint]').forEach(el => { if (!el.closest('#tourPanel')) el.remove(); });
  }

  /* ---------- views ---------- */
  function viewHome() {
    const s = S.season;
    let day = s.day.cur;
    let gs = dayGames(D, day);
    if (s.phase === 'done') {
      const lastDay = D.games.filter(g => g.st.final).reduce((m, g) => Math.max(m, g.day), 0);
      day = lastDay; gs = dayGames(D, day);
    }
    const nFin = gs.filter(g => g.st.final).length, nLive = gs.filter(g => g.st.live).length;
    let title;
    if (s.phase === 'done') title = 'Final Night · Day ' + day;
    else if (s.day.active) title = "Tonight's Games · Day " + day;
    else title = (tipsOn() ? 'Up Next · ' : '') + 'Day ' + day;
    let out = '';
    if (s.phase === 'done' && s.champion != null) {
      out += '<div class="banner"><strong>' + esc(pname(s.champion)) + '</strong> won the Season ' + s.n + ' championship.</div>';
    } else if (!s.day.active && s.phase !== 'done') {
      out += tip('<div class="banner">Press <strong>Start Day</strong> at the bottom left to start logging Day ' + day + '.</div>');
    }
    if (s.phase === 'reg') { const sc = scenarios(day); if (sc.length) out += '<div class="panel scen"><h3 class="h3" style="margin-bottom:6px">On the line ' + (s.day.active ? 'tonight' : 'Day ' + day) + '</h3>' + sc.map(t => '<div class="scl">' + t + '</div>').join('') + '</div>'; }
    const summary = gs.length + (gs.length === 1 ? ' game' : ' games') + (nFin ? ' · ' + nFin + ' final' : '') + (nLive ? ' · ' + nLive + ' live' : '');
    out += '<section class="section"><div class="shead"><h2 class="h2">' + esc(title) + '</h2><div class="pmuted" style="font-size:14px">' + summary + '</div></div>' +
      '<div class="ggrid">' + (gs.map(gameCard).join('') || '<div class="banner">No games on this day.</div>') + '</div></section>';
    return '<div class="stack">' + out + '</div>';
  }
  function dayBar() {
    const s = S.season;
    if (s.phase === 'done') return '<div class="daybar"><div class="wrap"><div class="status">Season ' + s.n + ' complete</div><button type="button" class="btn ghost" data-act="newseason" style="color:inherit;border-color:currentColor">' + 'Start next season' + '</button></div></div>';
    const gs = dayGames(D, s.day.cur);
    const left = s.day.active
      ? '<div class="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--good)"><path d="M5 12l5 5 9-10"></path></svg>Day ' + s.day.cur + ' started · ' + timeStr(s.day.startedAt) + '</div>'
      : '<button type="button" class="btn primary big" data-act="start">Start Day ' + s.day.cur + '</button>';
    let right = '';
    if (s.day.active) {
      const leftN = gs.filter(g => !g.st.final).length;
      if (canEnd()) {
        const auto = s.day.lastFinalAt ? ' title="Ends automatically at ' + esc(timeStr(s.day.lastFinalAt + AUTO_END_MS)) + '"' : '';
        right = '<button type="button" class="btn primary big" data-act="end"' + auto + '>End Day</button>';
      } else right = '<div class="left-note">' + leftN + (leftN === 1 ? ' game' : ' games') + ' left</div>';
    }
    return '<div class="daybar"><div class="wrap">' + left + right + '</div></div>';
  }

  function seasonPicker() {
    const ns = S.cfg.seasons.slice().sort((a, b) => b - a);
    if (ns.length < 2) return '';
    const v = D.season.n;
    return '<label class="spick"><span class="sr">Season</span><select id="seasonPick" aria-label="Season">' + ns.map(n => '<option value="' + n + '"' + (n === v ? ' selected' : '') + '>Season ' + n + (n === S.season.n ? ' (current)' : '') + '</option>').join('') + '</select></label>';
  }
  function viewStandings() {
    const s = D.season;
    const two = L.confCount() > 1, divs = L.hasDivs(), ln = L.lines();
    const views = two ? [['conf', 'Conference'], ...(divs ? [['div', 'Division']] : []), ['league', 'League']] : [['conf', 'League'], ...(divs ? [['div', 'Division']] : [])];
    if (!views.some(([k]) => k === S.standView)) S.standView = 'conf';
    let out = '<div class="shead"><h2 class="h2">Standings' + (D.cur ? '' : ' · Season ' + s.n) + '</h2><div class="hrow">' + seasonPicker() + '<div class="seg" role="tablist">' +
      views.map(([k, l]) => '<button type="button" class="' + (S.standView === k ? 'on' : '') + '" data-act="stand" data-v="' + k + '">' + l + '</button>').join('') + '</div></div></div>';
    // Standings after a past day (picked at the bottom), or as they are now
    const regDays = [...new Set(D.reg.filter(g => g.st.final).map(g => g.day))].sort((a, b) => a - b);
    if (S.standDayN !== s.n || !regDays.includes(S.standDay)) S.standDay = null;
    const past = S.standDay != null && S.standDay < regDays[regDays.length - 1] ? S.standDay : null;
    const rows = past != null ? L.standings(D.reg.filter(g => g.day <= past)) : D.rows;
    const cols = '<tr><th class="l">#</th><th class="l">Player</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>Home</th><th>Away</th>' + (divs ? '<th>Div</th>' : '') + (two ? '<th>Conf</th><th>Inter</th>' : '') + '<th>PF/G</th><th>PA/G</th><th>Diff</th><th>L10</th><th>Strk</th></tr>';
    const line = (r, i, opts) => {
      const gp = r.gp || 1;
      const marks = opts.marks && ln;
      const cut = marks ? (i === ln.direct - 1 ? ' class="cut"' : ln.playIn && i === ln.post - 1 ? ' class="cut2"' : '') : '';
      return '<tr' + cut + '><td class="l"><span class="seed">' + (i + 1) + '</span></td><td class="l"><span class="pname" data-act="team" data-p="' + pid(r.p) + '">' + esc(pname(r.p)) + '</span>' + (past == null ? markChips(r.p) : '') + '</td>' +
        '<td>' + r.w + '</td><td>' + r.l + '</td><td>' + fmtPct(r.pct) + '</td><td>' + (r.gb === 0 ? '—' : r.gb.toFixed(1)) + '</td>' +
        '<td>' + r.hw + '–' + r.hl + '</td><td>' + r.aw + '–' + r.al + '</td>' + (divs ? '<td>' + r.dw + '–' + r.dl + '</td>' : '') + (two ? '<td>' + r.cw + '–' + r.cl + '</td><td>' + r.iw + '–' + r.il + '</td>' : '') +
        '<td>' + (r.gp ? (r.pf / gp).toFixed(1) : '—') + '</td><td>' + (r.gp ? (r.pa / gp).toFixed(1) : '—') + '</td><td class="' + (r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : '') + '">' + (r.gp ? (r.diff > 0 ? '+' : '') + (r.diff / gp).toFixed(1) : '—') + '</td>' +
        '<td>' + r.l10[0] + '–' + r.l10[1] + '</td><td>' + r.streak + '</td></tr>';
    };
    const table = (title, ranked, opts) => '<div class="panel"><h3 class="h3" style="margin-bottom:8px">' + title + '</h3><div class="tscroll"><table class="tbl stick2">' + cols + ranked.map((r, i) => line(r, i, opts)).join('') + '</table></div></div>';
    const key = L.lines() && past == null ? '<div class="legend pmuted clkey">' + markKeys().map(k => '<span><span class="cl cl-' + k + '">' + k + '</span>' + MARK_SHORT()[k] + '</span>').join('') + '</div>' : '';
    // the bracket has its own page once the postseason starts
    if (past != null) {
      out += '<div class="banner pbar"><span>Standings after <b>Day ' + past + '</b></span><button type="button" class="btn sm" data-act="standday" data-v="">Back to today</button></div>';
    } else if (D.cur && s.phase === 'reg') {
      const sc = scenarios(s.day.cur);
      if (sc.length) out += '<div class="panel scen"><h3 class="h3" style="margin-bottom:6px">Scenarios · Day ' + s.day.cur + '</h3>' + sc.map(t => '<div class="scl">' + t + '</div>').join('') + '</div>';
    }
    if (S.standView === 'conf') {
      out += confList().map(c => table(two ? confName(c) + ' Conference' : esc(S.cfg.leagueName), confRank(rows, c), { marks: true })).join('') + key;
    } else if (S.standView === 'div') {
      out += divList().map(d => table(divName(d) + ' Division' + (two ? ' <span class="muted" style="font-size:13px;text-transform:none;letter-spacing:0">· ' + confName(L.confOf(L.divIds(d)[0])) + '</span>' : ''), L.rankGroup(rows, L.divIds(d)), { marks: false })).join('') + key;
    } else if (S.standView === 'league') {
      out += table('Whole League', L.rankGroup(rows, L.allIds()), { marks: false }) + key;
    }
    if (regDays.length > 1) {
      out += '<div class="asof pmuted"><label for="standDay">Standings after</label> <select id="standDay"><option value="">Today</option>' +
        regDays.slice(0, -1).reverse().map(d => '<option value="' + d + '"' + (d === past ? ' selected' : '') + '>Day ' + d + '</option>').join('') + '</select></div>';
    }
    return '<div class="stack" style="gap:16px">' + out + '</div>';
  }

  /* ---------- games page (scoreboard by day) ---------- */
  function viewGames() {
    const s = D.season;
    const tp = S.gamesTeam == null || seatOf(S.gamesTeam) < 0 ? null : seatOf(S.gamesTeam);   // S.gamesTeam is a profile; a season it did not play falls back to the scoreboard
    const days = [...new Set(D.games.map(g => g.day))].sort((a, b) => a - b);
    const curDay = D.cur ? (s.phase === 'done' ? days[days.length - 1] : s.day.cur) : days[days.length - 1];
    let day = S.gamesDay != null && days.includes(S.gamesDay) && S.gamesDayN === s.n ? S.gamesDay : curDay;
    if (!days.includes(day)) day = days.find(d => d >= day) ?? days[days.length - 1];
    S.gamesDay = day; S.gamesDayN = s.n;
    const playerSel = '<select id="gamesTeam" aria-label="Player schedule"><option value="">Player schedule…</option>' + L.allIds().sort((a, b) => pname(a).localeCompare(pname(b))).map(p => '<option value="' + pid(p) + '"' + (tp === p ? ' selected' : '') + '>' + esc(pname(p)) + '</option>').join('') + '</select>';
    let out = '<div class="shead"><h2 class="h2">Games' + (D.cur ? '' : ' · Season ' + s.n) + '</h2><div class="hrow">' + seasonPicker() + playerSel + '</div></div>';
    if (tp != null) {
      // one team's whole schedule
      const list = D.games.filter(g => g.a === tp || g.h === tp).sort((x, y) => x.day - y.day || x.idx - y.idx);
      const r = D.rows[tp];
      out += '<div class="banner pbar"><span><b>' + esc(pname(tp)) + '</b> · ' + r.w + '–' + r.l + ' · ' + list.filter(g => !g.st.final).length + ' games left</span><button type="button" class="btn sm" data-act="gclear">Back to scoreboard</button></div>';
      // the player's record after each game (in a series, the series score)
      let w = 0, l = 0;
      const ser = {};
      const after = g => {
        if (!g.st.final) return '';
        const won = (g.h === tp ? g.st.h : g.st.a) > (g.h === tp ? g.st.a : g.st.h);
        if (g.type === 'reg') { if (won) w++; else l++; return w + '–' + l; }
        const x = g.sid ? findSeries(g.sid) : null;
        if (!x || x.bo === 1) return '';
        const sc = ser[g.sid] = ser[g.sid] || [0, 0];
        sc[won ? 0 : 1]++;
        return 'Series ' + sc[0] + '–' + sc[1];
      };
      out += '<div class="glist">' + list.map(g => gameRow(g, tp, after(g))).join('') + '</div>';
      return '<div class="stack" style="gap:14px">' + out + '</div>';
    }
    // calendar: 4 weeks a page, 7 days a row
    const PAGE = 28;
    const planned = new Set();   // postseason days on the calendar that don't have games yet
    if (D.cur && s.phase !== 'done' && L.lines()) {
      const plan = s.phase === 'reg' ? postPlan(s.totalDays) : s.post.plan;
      if (plan) Object.values(plan.days).forEach(ds => ds.forEach(d => { if (!days.includes(d)) planned.add(d); }));
    }
    const lastCal = Math.max(days[days.length - 1], ...planned);
    // the page with the picked day, unless the arrows moved to another page
    const lastPage = Math.floor((lastCal - 1) / PAGE);
    const page = S.gamesPage != null && S.gamesPage <= lastPage && S.gamesDayN === s.n ? S.gamesPage : Math.floor((day - 1) / PAGE);
    const from = page * PAGE + 1, to = Math.min(from + PAGE - 1, lastCal);
    const cell = d => {
      const gs = D.games.filter(g => g.day === d);
      if (!gs.length) return '<div class="cday ' + (planned.has(d) ? 'plan' : 'off') + '"><b>' + d + '</b>' + (planned.has(d) ? '<small>Playoffs</small>' : '') + '</div>';
      const fin = gs.every(g => g.st.final), live = gs.some(g => g.st.live);
      const post = gs.some(g => g.type !== 'reg');
      const tag = post ? (gs.some(g => g.type === 'playin') ? 'Play-In' : roundName(Math.max(...gs.map(g => g.round)))) : gs.length + (gs.length === 1 ? ' game' : ' games');
      const today = D.cur && d === curDay && s.phase !== 'done';
      return '<button type="button" class="cday' + (d === day ? ' on' : '') + (today ? ' today' : '') + (post ? ' post' : '') + '" data-act="gday" data-v="' + d + '" aria-pressed="' + (d === day) + '" aria-label="Day ' + d + ', ' + esc(tag) + (today ? ', today' : '') + '"><b>' + d + '</b><small>' + esc(tag) + '</small><i class="dst ' + (live ? 'live' : fin ? 'fin' : 'up') + '"></i></button>';
    };
    const cells = [];
    for (let d = from; d <= to; d++) cells.push(cell(d));
    out += '<section class="cal"><div class="calhead"><button type="button" class="darrow" data-act="gpage" data-v="' + (page - 1) + '"' + (page > 0 ? '' : ' disabled') + ' aria-label="Earlier days">‹</button>' +
      '<b>Days ' + from + '–' + to + '</b>' +
      '<button type="button" class="darrow" data-act="gpage" data-v="' + (page + 1) + '"' + (page < lastPage ? '' : ' disabled') + ' aria-label="Later days">›</button></div>' +
      '<div class="calgrid">' + cells.join('') + '</div></section>';
    const gs = D.games.filter(g => g.day === day).sort((x, y) => x.idx - y.idx);
    const nf = gs.filter(g => g.st.final).length;
    out += '<div class="shead"><h3 class="h3" style="color:var(--page-ink)">Day ' + day + (D.cur && day === curDay && s.phase !== 'done' ? (s.day.active ? ' · Today' : (tipsOn() ? ' · Up next' : '')) : '') + '</h3><div class="pmuted" style="font-size:14px">' + gs.length + (gs.length === 1 ? ' game' : ' games') + (nf ? ' · ' + nf + ' final' : '') + (D.cur && day !== curDay && s.phase !== 'done' ? ' · <button type="button" class="linkbtn" data-act="gday" data-v="' + curDay + '">Back to Day ' + curDay + '</button>' : '') + '</div></div>';
    out += '<div class="ggrid">' + gs.map(gameCard).join('') + '</div>';
    if (D.cur && s.phase === 'reg' && !s.day.active && day < curDay) {
      const armed = S.confirm === 'restartday';
      out += '<div class="frow" style="justify-content:center;gap:12px;align-items:center">' + (armed ? '<span class="pmuted">Any game data on this specific day will be erased.</span>' : '') + '<button type="button" class="btn danger" data-act="restartday" data-v="' + day + '">' + (armed ? 'Tap again to erase Day ' + day + ' and restart it' : 'Restart this day') + '</button></div>';
    }
    return '<div class="stack" style="gap:14px">' + out + '</div>';
  }
  function gameRow(g, me, recAfter) {
    const st = g.st, s = D.season;
    const x = g.sid ? findSeries(g.sid) : null;
    const tag = '<span class="gtag">Day ' + g.day + (g.type === 'reg' ? '' : ' · ' + esc(roundName(g.round)) + (x && x.bo > 1 ? ' G' + g.no : '')) + '</span>';
    const home = g.h === me, opp = home ? g.a : g.h;
    let res;
    if (st.final) { const my = home ? st.h : st.a, th = home ? st.a : st.h; res = '<span class="' + (my > th ? 'w' : 'l') + '">' + (my > th ? 'W ' : 'L ') + my + '–' + th + '</span>' + (st.ot ? ' <small>' + (st.ot === 1 ? 'OT' : st.ot + 'OT') + '</small>' : ''); }
    else if (st.live) res = '<span class="livetxt">' + (home ? st.h + '–' + st.a : st.a + '–' + st.h) + ' · ' + (st.n ? esc(st.short) : tip(esc(st.short))) + '</span>';

  /* ---------- series helpers, ESPN-style bracket, series overview ---------- */

  /* ---------- League setup: players, conferences and divisions, games, playoffs ---------- */

  const SETUP_FORMATS = {

  /* ---------- stats ---------- */

  /* ---------- divisions and conferences: records as a group ----------

  const groupName = k => (k[0] === 'd' ? divName(+k.slice(1)) : confName(+k.slice(1)) + ' Conference');
  const inGroup = (k, seat) => (k[0] === 'd' ? L.divOf(seat) === +k.slice(1) : L.confOf(seat) === +k.slice(1));
  const confOfKey = k => (k[0] === 'd' ? L.confOf(L.divIds(+k.slice(1))[0]) : +k.slice(1));

    if (b === 'othconf') return L.confOf(seat) !== confOfKey(a);

  // a group's record against another over a list of { g, d } (each season read with its own league shape)
  function groupRecord(list, a, b) {

    for (const { g, d } of list) {

      if (shapeN !== d.season.n) { L.use(d.season.shape); shapeN = d.season.n; }
      const aIn = inGroup(a, g.a), hIn = inGroup(a, g.h);
      if (aIn === hIn) continue;
      const mine = aIn ? g.a : g.h, opp = aIn ? g.h : g.a;
      if (!inOther(a, b, opp)) continue;
      const my = mine === g.a ? g.st.a : g.st.h, th = mine === g.a ? g.st.h : g.st.a;
      if (my > th) t.w++; else t.l++;
      t.pf += my; t.pa += th;

    return t;

  // Divisions page: the season's regular-season games (or a past season's), then each division's own page
  function viewDivisions() {

    if (S.divPage != null && L.hasDivs() && S.divPage < L.divCount()) return viewDivision(S.divPage, games);

    return '<div class="stack" style="gap:16px">' + head + tip('<div class="note">Regular season. Tap a division for its page.</div>') + groupStats(games) + '</div>';
  }
  function viewDivision(di, games) {
    const s = D.season, k = 'd' + di, two = L.confCount() > 1, ids = L.divIds(di);
    const rest = groupRecord(games, k, 'rest'), conf = groupRecord(games, k, 'restconf'), oth = two ? groupRecord(games, k, 'othconf') : null;
    // rank among the divisions this season
    const order = divList().map(i => ({ i, r: groupRecord(games, 'd' + i, 'rest') })).sort((x, y) => gPct(y.r) - gPct(x.r) || y.r.w - x.r.w);
    const rank = order.findIndex(x => x.i === di) + 1;
    // each player: overall record, and record against players outside the division (what they add to the division's record)
    const mem = ids.map(seat => {
      const t = { w: 0, l: 0, cw: 0, cl: 0, iw: 0, il: 0, pf: 0, pa: 0 };

  /* ---------- Possession scoring (Dice League 2.0) ----------
     A roll is one possession for each player, the away player first. Whoever has the ball rolls:
       Die 1: 1 dead-ball turnover · 2 live-ball turnover (a fast break for the other player's next possession)
              · 3–5 a 2-point shot · 6 a 3-point shot
       Die 2: 1–3 miss · 4–5 make (3–5 on a fast break) · 6 foul
       Foul, two dice: first 1–5 missed (free throws: 2 on a 2, 3 on a 3), 6 made and-one;
              second, the free throws: and-one 1–2 miss, 3–6 make; 2 shots 1 none, 2–4 one, 5–6 both;
              3 shots 1 none, 2 one, 3–4 two, 5–6 three. A missed last free throw is a dead ball.
       Miss, two dice: first 1 out of bounds, 2 offensive rebound, 3–6 defensive rebound (second die not used);
              second, on an offensive rebound 1–4 no putback (keeps the ball, rolls again), 5–6 putback for 2;
              on out of bounds 1 the shooter's ball (rolls again), 2–6 the other player's. */
  // rebounds by type (b = Center, n = Forward, s = Guard). Die 3 offensive rebounds run from 2 up to orebTop:
  //   Guard shooting: none · Center shooting: 2-3 · Forward shooting: 2-3 against a Guard, otherwise 2.
  // Die 4 putback: Guard 6 only, Forward 5-6, Center 4-6.
  //   Guard on Guard and Center on Center play the regular (Forward) rebound rules.
  const rebType = (type, opp) => (type === opp && type !== 'n' ? 'n' : type) || 'n';
  const orebTop = (type, opp) => { const t = rebType(type, opp); return t === 's' ? 1 : t === 'b' ? 3 : opp === 's' && type !== 's' ? 3 : 2; };
  const PUTBACK = { b: 4, n: 5, s: 6 };
  // Offense vs Defense: edge = the shooter's Offense stars minus the other player's Defense stars.
  // Die 2 makes from makeLow to 5. Within 1 star: no shift (4-5). 2 stars: 1 shift (better 3-5, worse 5 only).
  // 3 or more: 2 shifts (better 2-5; worse would leave no makes, so it stays at 1 shift, 5 only). A fast break makes one number easier, at best 2-5.
  const makeLow = (edge, fb) => { const d = edge || 0, sh = Math.sign(d) * (Math.abs(d) >= 3 ? 2 : Math.abs(d) === 2 ? 1 : 0); const low = Math.max(2, Math.min(5, 4 - sh)); return fb ? Math.max(2, low - 1) : low; };   // a fast break makes at best on 2-5
  function possWalk(dice, fast, type, opp, edge) {
    let i = 0, pts = 0, first = true, steal = false;
    const parts = [];
    // box score for this possession. odrb (defensive rebounds) and ostl (steals) go to the other player.
    const bx = { fga: 0, fgm: 0, tpa: 0, tpm: 0, fta: 0, ftm: 0, orb: 0, odrb: 0, to: 0, ostl: 0, pb: 0, fbp: 0, a1: 0 };
    // play-by-play: one event per die read: { i (which die in the list), k (what happened), v (2 or 3), fb (fast break), m (free throws made), p (points) }
    const ev = [];
    const say = (k, x) => ev.push(Object.assign({ i: i - 1, k, p: 0 }, x || {}));
    const out = (done, need) => ({ done, need: need || null, pts, steal, bx, ev, text: parts.join(', ') });
    const shot = (v, made) => { bx.fga++; if (v === 3) bx.tpa++; if (made) { bx.fgm++; if (v === 3) bx.tpm++; } };
    for (;;) {
      if (i >= dice.length) return out(false, 'Die 1 · shot or turnover');
      const d1 = dice[i++];
      if (d1 === 1) { bx.to++; say('to'); parts.push('turnover (dead ball)'); return out(true); }
      if (d1 === 2) { bx.to++; bx.ostl++; say('stl'); parts.push('turnover (stolen)'); steal = true; return out(true); }
      const val = type === 's' ? (d1 >= 5 ? 3 : 2) : type === 'b' ? 2 : (d1 === 6 ? 3 : 2), fb = first && fast;   // Guard: 5-6 are 3s · Forward: 6 · Center: no 3s
      first = false;
      say('sh', { v: val, fb });
      if (i >= dice.length) return out(false, 'Die 2 · make, miss or foul');
      const d2 = dice[i++];
      if (d2 === 6) {
        say('fl', { v: val });
        if (i >= dice.length) return out(false, 'Foul · did the shot go in?');
        const f1 = dice[i++];
        if (f1 === 6) { pts += val; say('and1', { v: val, p: val }); } else say('nogo', { v: val });
        if (i >= dice.length) return out(false, 'Free throws');
        const f2 = dice[i++];
        if (f1 === 6) {
          const ft = f2 >= 3 ? 1 : 0;
          say(ft ? 'a1m' : 'a1x', { p: ft, v: val });
          pts += ft;

  // The stretch of rolls (from..to) where one player outscored the other by the most: { who: 'a'|'h', a, h, from, to }
  function bestRun(rolls, from, to) {

    for (const sign of [1, -1]) {
      let sum = 0, start = from;
      for (let i = from; i <= to; i++) {
        if (sum <= 0) { sum = 0; start = i; }
        sum += sign * (rolls[i][0] - rolls[i][1]);
        if (sum > 0 && (!best || sum > best.sum)) best = { sum, from: start, to: i, who: sign > 0 ? 'a' : 'h' };
      }
    }
    if (!best) return null;
    best.a = 0; best.h = 0;
    for (let i = best.from; i <= best.to; i++) { best.a += rolls[i][0]; best.h += rolls[i][1]; }

  }

  function timesTied(rolls) {

    rolls.forEach(r => { step(r[0], 0); step(0, r[1]); });

  }

    }
