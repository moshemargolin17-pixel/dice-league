  document.addEventListener('keydown', e => {
    if (Tour.cur) {
      if (e.key === 'Escape') { if (Tour.cur.skip || Tour.cur.last) tourEnd(); else tourSkip(); }
      else if (e.key === 'ArrowRight' && !Tour.cur.skip && !Tour.cur.last) tourShow(Tour.i + 1);
      else if (e.key === 'ArrowLeft' && !Tour.cur.skip && Tour.i > 0) tourShow(Tour.i - 1);
      return;
    }
    if (!S.sheet) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'rollA') { e.preventDefault(); const h = document.getElementById('rollH'); if (h && h.value !== '' && e.target.value !== '') logRoll(); else if (h) h.focus(); }
    else if (e.key === 'Enter' && e.target && e.target.id === 'rollH') { e.preventDefault(); logRoll(); }
  });
  window.addEventListener('beforeunload', e => { if (Store.pending()) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkAutoEnd(); reloadIfIdle(); }
  });

  async function reloadIfIdle() {
    if (!S.ready || S.sheet || S.view === 'settings' || S.view === 'setup' || Store.pending()) return;
    try {
      const cfg = await Store.get('league/config');
      if (!cfg || Store.pending() || S.sheet) return;
      const season = await Store.get(seasonPath(cfg.currentSeason));
      const list = await Store.list(seasonPath(cfg.currentSeason) + '/days');
      if (Store.pending() || S.sheet) return;
      S.cfg = normPlayers(cfg); S.season = season; S.days = {}; list.forEach(x => { S.days[x.day] = x; });
      await upgradeSkillRules();
      applyTheme(cfg.theme); refresh(); healDay(); render();
    } catch (e) { /* keep what is on screen */ }
  }
  /* ---------- backup / restore ---------- */
  async function collectLeague() {
    while (Store.pending()) await new Promise(r => setTimeout(r, 50));
    const cfg = clone(S.cfg);
    const seasons = {};
    for (const n of cfg.seasons) {
      const season = n === S.season.n ? clone(S.season) : await Store.get(seasonPath(n));
      if (!season) continue;
      const days = n === S.season.n ? Object.values(S.days).map(clone) : await Store.list(seasonPath(n) + '/days');
      seasons[n] = { season, days };
    }
    return { app: 'dice-league', v: 1, savedAt: new Date().toISOString(), cfg, seasons };
  }
  async function backupLeague() {
    try {
      const s = S.season;
      S.cfg.lastBackup = { season: s.n, day: s.day.cur, at: Date.now() };
      S.cfg.sinceBackup = 0;
      const data = await collectLeague();
      const name = (S.cfg.leagueName || 'dice-league').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() + '-S' + s.n + '-day' + s.day.cur + '-' + new Date().toISOString().slice(0, 10) + '.json';
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      // inside Claude, files are handed over through the downloads capability
      if (Store.mode === 'db') {
        const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
        if (!dl) { toast('Downloading isn’t available here.'); return; }
        try { await dl.save({ filename: name, data: blob }); }
        catch (e) { if (e && e.code === 'declined') { toast('Backup not saved.'); return; } throw e; }
        saveCfg(); render(); toast('Backup saved: ' + name); return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      saveCfg(); render();
      toast('Backup downloaded: ' + name);
    } catch (e) { console.error(e); toast('Backup failed. Try again.'); }
  }
  function validBackup(d) {
    if (!d || d.app !== 'dice-league' || !d.cfg || !d.seasons) return false;
    const c = d.cfg;
    if (!Array.isArray(c.players) || c.players.length < 1 || !Array.isArray(c.seasons) || !c.currentSeason) return false;
    const cur = d.seasons[c.currentSeason];
    if (!cur || !cur.season || !Array.isArray(cur.days)) return false;
    return Object.values(d.seasons).every(x => x && x.season && Array.isArray(x.season.sched) && Array.isArray(x.days));
  }
  function readBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(r.result); } catch (e) { d = null; }
      if (!validBackup(d)) { S.restore = null; render(); toast('That file isn’t a Dice League backup.'); return; }
      S.restore = { name: file.name, data: d }; S.confirm = null; render();
      toast('Backup ready. Tap the red Load button to replace this league.');
    };
    r.onerror = () => toast('Couldn’t read that file.');
    r.readAsText(file);
  }
  async function restoreLeague() {
    const d = S.restore && S.restore.data;
    if (!d) return;
    try {
      while (Store.pending()) await new Promise(r => setTimeout(r, 50));
      for (const n of S.cfg.seasons) {
        const list = await Store.list(seasonPath(n) + '/days').catch(() => []);
        for (const x of list) await Store.del(dayPath(n, x.day)).catch(() => {});
        await Store.del(seasonPath(n)).catch(() => {});
      }
      for (const [n, x] of Object.entries(d.seasons)) {
        await Store.write(seasonPath(+n), x.season);
        for (const day of x.days) await Store.write(dayPath(+n, day.day), day);
      }
      const cfg = normPlayers(d.cfg);
      cfg.seasons = cfg.seasons.filter(n => d.seasons[n]);
      await Store.write('league/config', cfg);
      const cur = d.seasons[cfg.currentSeason];
      S.cfg = cfg; S.season = cur.season; S.days = {}; cur.days.forEach(x => { S.days[x.day] = x; });
      await upgradeSkillRules();
      S.past = {}; S.restore = null; S.sheet = null;
      applyTheme(cfg.theme); refresh(); healDay(); S.view = 'home'; render(); window.scrollTo(0, 0);
      toast('League restored: Season ' + cfg.currentSeason + ', Day ' + S.season.day.cur + '.');
    } catch (e) {
      console.error(e);
      toast(e && e.name === 'QuotaExceededError' ? 'This browser is out of storage space.' : 'Restore failed. Your backup file is unchanged; try again.');
    }
  }
  async function resetLeague() {
    const ns = S.cfg.seasons.slice();
    for (const n of ns) {
      const list = await Store.list(seasonPath(n) + '/days').catch(() => []);
      for (const d of list) await Store.del(dayPath(n, d.day)).catch(() => {});
      await Store.del(seasonPath(n)).catch(() => {});
    }
    const theme = S.cfg.theme;
    S.cfg = normPlayers(defaultConfig()); S.cfg.theme = theme;
    S.season = newSeasonDoc(1); S.days = {}; S.past = {};
    await Store.write('league/config', S.cfg);
    await Store.write(seasonPath(1), S.season);
    refresh(); S.view = 'home'; render(); toast('League reset. Season 1 is ready.');
  }

  /* ---------- boot ---------- */
  async function boot() {
    let t = null, v = null;
    try { t = localStorage.getItem(LSK + 'theme'); v = localStorage.getItem(LSK + 'view'); } catch (e) { /* */ }
    applyTheme(t || 'v20');
    if (v) S.view = v;
    app.innerHTML = '<div class="wrap"><div class="loading">Loading your league…</div></div>';
    if (Cloud.on) { try { await cloudGate(); } catch (e) { console.error(e); app.innerHTML = '<div class="wrap"><div class="loading">Couldn’t reach the sign-in server. Check your internet and reload.</div></div>'; return; } app.innerHTML = '<div class="wrap"><div class="loading">Loading your league…</div></div>'; }
    await Store.init();
    try { await Leagues.load(); } catch (e) { console.error(e); }
    let fresh = false;   // a brand-new online account: show the tutorial once
    try {
      let cfg = await Store.get('league/config');
      if (!cfg) {
        fresh = Store.mode === 'cloud' && !Store.px;
        S.cfg = normPlayers(defaultConfig()); S.cfg.theme = t || 'v20';
        const ent = Leagues.list.find(x => x.id === Leagues.id); if (ent && ent.name) S.cfg.leagueName = ent.name;
        S.season = newSeasonDoc(1); S.days = {};
        await Store.write('league/config', S.cfg);
        await Store.write(seasonPath(1), S.season);
      } else {
        S.cfg = normPlayers(cfg);
        let season = await Store.get(seasonPath(cfg.currentSeason));
        if (!season) { season = newSeasonDoc(cfg.currentSeason); await Store.write(seasonPath(cfg.currentSeason), season); }
        // seasons made before the rules update: the season in progress switches to the new rules from here on
        if (!season.rules && season.phase !== 'done') { season.rules = clone(E.RULES_V2); season.log = season.log || []; await Store.write(seasonPath(cfg.currentSeason), season); }
        S.season = season;
        const list = await Store.list(seasonPath(cfg.currentSeason) + '/days');
        S.days = {}; list.forEach(x => { S.days[x.day] = x; });
      }
      await upgradeSkillRules();
    } catch (e) {
      console.error(e);
      app.innerHTML = '<div class="wrap"><div class="loading">Couldn’t load the league. Check your connection and reopen the page.</div></div>';
      return;
    }
    applyTheme(S.cfg.theme);
    refresh();
    healDay();
    S.ready = true;
    render();
    if (fresh) tourStart();
    checkAutoEnd();
    setInterval(checkAutoEnd, 60000);
  }
  if (window.__DL_TEST__) window.__DL_TEST__ = { S, D: () => D, setRolls, startDay, endDay, refresh, render, renderSheet, canEnd, seriesInfo, ensureEntry, runAuto, marksOf, scenarios, E, loadPast, healDay };
  boot();
})();
</script>
</body></html>
