<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice League 2.0</title>
  <meta name="theme-color" content="#F3F4F7">
  <link rel="icon" href="../original/icon.svg">
  <link rel="apple-touch-icon" href="../original/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* Dice League 2.0's look: light gray, white panels and the 2.0 red (with a dark version at night). */
    :root {
      color-scheme: light;
      --bg: #F3F4F7; --head-bg: #FFFFFF; --panel: #FFFFFF; --panel-2: #F3F4F7;
      --ink: #141A26; --muted: #5B6478; --line: #DCE0E8;
      --accent: #D2283C; --accent-ink: #FFFFFF;
      --f-display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
      --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --radius: 16px;
      --gut-l: max(16px, env(safe-area-inset-left, 0px));
      --gut-r: max(16px, env(safe-area-inset-right, 0px));
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0F131B; --head-bg: #181E2A; --panel: #181E2A; --panel-2: #131926;
        --ink: #EEF1F6; --muted: #98A1B3; --line: #283043;
        --accent: #FF5A6A; --accent-ink: #0F131B;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body);
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
    header.top { background: var(--head-bg); border-bottom: 1px solid var(--line); }
    header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; }
    .brand h1 { margin: 0; font: 800 22px/1.05 var(--f-display); letter-spacing: -.01em; }
    .brand .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .switch { font: 600 14px var(--f-body); color: var(--muted); text-decoration: none; padding: 9px 12px; border-radius: 10px; }
    .switch:hover { color: var(--ink); background: var(--panel-2); }
    main .wrap { padding-block: 28px 48px; display: grid; gap: 14px; }
    .h2 { margin: 12px 0 0; font: 800 24px/1.1 var(--f-display); }
    .modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .modes-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mode {
      display: flex; flex-direction: column; gap: 10px; padding: 20px; min-height: 120px;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none;
    }
    .mode h3 { margin: 0; font: 800 28px/1 var(--f-display); }
    .mode .tag {
      align-self: flex-start; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .06em;
      padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted);
    }
    a.mode:hover { border-color: var(--accent); }
    a.mode:focus-visible, .switch:focus-visible, .brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .mode-live { grid-column: 1 / -1; min-height: 150px; }
    .mode-live h3 { font-size: 44px; }
    .mode-live .tag { background: var(--accent); color: var(--accent-ink); }
    .mode-soon { background: transparent; border-style: dashed; }
    .mode-soon h3 { color: var(--muted); }
    @media (max-width: 760px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } .modes-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html">
        <svg width="38" height="38" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="9" fill="#D2283C"></rect><g fill="#FFFFFF"><circle cx="13" cy="13" r="4"></circle><circle cx="31" cy="13" r="4"></circle><circle cx="22" cy="22" r="4"></circle><circle cx="13" cy="31" r="4"></circle><circle cx="31" cy="31" r="4"></circle></g></svg>
        <div><h1>Dice League</h1><div class="sub">2.0</div></div>
      </a>
      <a class="switch" href="../original/index.html">Switch to Original</a>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h2 class="h2">Choose a mode</h2>
      <div class="modes">
        <a class="mode mode-live" href="league.html"><span class="tag">Open now</span><h3>1 vs 1</h3></a>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>2 vs 2</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>3 vs 3</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>4 vs 4</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>5 vs 5</h3></div>
      </div>
      <h2 class="h2">More ways to play</h2>
      <div class="modes modes-3">
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Quick Game</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Tournament</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Practice</h3></div>
      </div>
    </div>
  </main>
</body>
</html>
