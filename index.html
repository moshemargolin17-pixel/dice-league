<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice League</title>
  <link rel="icon" href="original/icon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&family=Oswald:wght@700&family=Barlow:wght@500&display=swap">
  <style>
    /* Version picker: each card previews the look of the league it opens. */
    :root {
      --bg: #F3F4F7; --ink: #141A26; --muted: #5B6478; --line: #DCE0E8;
      --gut-l: max(16px, env(safe-area-inset-left, 0px));
      --gut-r: max(16px, env(safe-area-inset-right, 0px));
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0F131B; --ink: #EEF1F6; --muted: #98A1B3; --line: #283043; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0F131B; --ink: #EEF1F6; --muted: #98A1B3; --line: #283043; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font: 400 16px/1.5 'Inter', system-ui, sans-serif;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 56px var(--gut-r) 64px var(--gut-l); display: grid; gap: 28px; }
    h1 { margin: 0; font: 800 clamp(40px, 8vw, 72px)/1 'Bricolage Grotesque', 'Arial Black', sans-serif; letter-spacing: -.03em; text-wrap: balance; }
    .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .ver {
      display: grid; gap: 14px; align-content: space-between; min-height: 260px; padding: 28px;
      border-radius: 18px; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
    }
    .ver:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0, 0, 0, .18); }
    .ver:focus-visible { outline: 3px solid #2457C5; outline-offset: 3px; }
    .ver-name { margin: 0; }
    .ver-go { font-weight: 600; }
    .die { width: 48px; height: 48px; }
    /* Original: navy and amber */
    .v1 { background: #0E1A2B; color: #E8EEF6; border: 1px solid #22385A; }
    .v1 .ver-name { font: 700 40px/1 'Oswald', Impact, sans-serif; text-transform: uppercase; letter-spacing: .06em; }
    .v1 .ver-go { color: #FFB020; font-family: 'Barlow', sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    /* 2.0: light with red and blue */
    .v2 { background: #FFFFFF; color: #141A26; border: 1px solid #DCE0E8; }
    .v2 .ver-name { font: 800 40px/1 'Bricolage Grotesque', 'Arial Black', sans-serif; letter-spacing: -.02em; }
    .v2 .ver-go { color: #D2283C; }
    @media (max-width: 640px) { .pick { grid-template-columns: 1fr; } .ver { min-height: 200px; } }
    @media (prefers-reduced-motion: reduce) { .ver { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Which Dice League?</h1>
    <div class="pick">
      <a class="ver v1" href="original/">
        <svg class="die" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="9" fill="#FFB020"></rect><g fill="#0E1A2B"><circle cx="13" cy="13" r="4"></circle><circle cx="31" cy="13" r="4"></circle><circle cx="22" cy="22" r="4"></circle><circle cx="13" cy="31" r="4"></circle><circle cx="31" cy="31" r="4"></circle></g></svg>
        <p class="ver-name">Dice League Original</p>
        <span class="ver-go">Play →</span>
      </a>
      <a class="ver v2" href="v2/">
        <svg class="die" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="9" fill="#D2283C"></rect><g fill="#FFFFFF"><circle cx="13" cy="13" r="4"></circle><circle cx="31" cy="13" r="4"></circle><circle cx="22" cy="22" r="4"></circle><circle cx="13" cy="31" r="4"></circle><circle cx="31" cy="31" r="4"></circle></g></svg>
        <p class="ver-name">Dice League 2.0</p>
        <span class="ver-go">Play →</span>
      </a>
    </div>
  </main>
</body>
</html>
