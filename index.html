<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice League</title>
  <link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&family=Archivo:wght@600;800&display=swap">
  <style>
    /* Version picker: each card previews the look of the league it opens. */
    :root {
      --bg: #F3F4F7; --ink: #141A26; --muted: #5B6478; --line: #DCE0E8;
      --gut-l: max(16px, env(safe-area-inset-left, 0px));
      --gut-r: max(16px, env(safe-area-inset-right, 0px));
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0F131B; --ink: #EEF1F6; --muted: #98A1B3; --line: #283043; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0F131B; --ink: #EEF1F6; --muted: #98A1B3; --line: #283043; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font: 400 16px/1.5 'Inter', system-ui, sans-serif;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 56px var(--gut-r) 64px var(--gut-l); display: grid; gap: 28px; }
    .brandmark { display: block; margin-bottom: -12px; }
    h1 { margin: 0; font: 800 clamp(40px, 8vw, 72px)/1 'Bricolage Grotesque', 'Arial Black', sans-serif; letter-spacing: -.03em; text-wrap: balance; }
    .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .ver {
      display: grid; gap: 14px; align-content: space-between; min-height: 260px; padding: 28px;
      border-radius: 18px; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
    }
    .ver:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0, 0, 0, .18); }
    .ver:focus-visible { outline: 3px solid #2457C5; outline-offset: 3px; }
    .ver-name { margin: 0; }
    .ver-go { font-weight: 600; }
    .die { width: 48px; height: 48px; }
    /* Original: its default Black & White design */
    .v1 { background: #000000; color: #FFFFFF; border: 2px solid #000000; border-radius: 0; }
    .v1 .ver-name { font: 800 38px/1 'Archivo', system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
    .v1 .ver-go { color: #FFFFFF; font-family: 'Archivo', sans-serif; text-transform: uppercase; letter-spacing: .06em; }
    /* 2.0: light with red and blue */
    .v2 { background: #FFFFFF; color: #141A26; border: 1px solid #DCE0E8; }
    .v2 .ver-name { font: 800 40px/1 'Bricolage Grotesque', 'Arial Black', sans-serif; letter-spacing: -.02em; }
    .v2 .ver-go { color: #178A3F; }
    @media (max-width: 640px) { .pick { grid-template-columns: 1fr; } .ver { min-height: 200px; } }
    @media (prefers-reduced-motion: reduce) { .ver { transition: none; } }

    /* Account: one sign-in for the whole site */
    :root { --surface: #FFFFFF; --red: #D2283C; --blue: #2457C5; --bad: #C0283A; --good: #1E8A4C; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #181E2A; --red: #FF5A6A; --blue: #6E9BFF; --bad: #FF7A88; --good: #5FD18B; } }
    :root[data-theme="dark"] { --surface: #181E2A; --red: #FF5A6A; --blue: #6E9BFF; --bad: #FF7A88; --good: #5FD18B; }
    [hidden] { display: none !important; }
    .auth { display: grid; gap: 16px; max-width: 420px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .auth h2 { margin: 0; font: 800 26px/1.1 'Bricolage Grotesque', 'Arial Black', sans-serif; }
    .auth p { margin: 0; }
    .field { display: grid; gap: 6px; }
    .field span { font-size: 14px; font-weight: 600; }
    .field input {
      min-height: 46px; padding: 10px 12px; font: 500 16px 'Inter', system-ui, sans-serif; color: var(--ink);
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    }
    .field input:focus-visible { outline: 3px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
    .btn { font: 600 16px/1 'Inter', system-ui, sans-serif; border: 0; border-radius: 12px; padding: 14px 20px; cursor: pointer; background: var(--red); color: #FFFFFF; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .linkbtn { appearance: none; background: none; border: 0; padding: 0; font: 600 14px 'Inter', system-ui, sans-serif; color: var(--red); cursor: pointer; text-decoration: underline; }
    .msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
    .msg.bad { color: var(--bad); border-color: var(--bad); }
    .msg.good { color: var(--good); border-color: var(--good); }
    .muted { color: var(--muted); }
    .who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="brandmark" width="56" height="56" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="bmb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#3B82F6"></stop></linearGradient><linearGradient id="bmf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7"></stop><stop offset="1" stop-color="#EC4899"></stop></linearGradient></defs><rect x="17" y="3" width="24" height="24" rx="6" fill="url(#bmb)"></rect><g fill="#FFFFFF"><circle cx="23" cy="9" r="2.4"></circle><circle cx="29" cy="15" r="2.4"></circle><circle cx="35" cy="21" r="2.4"></circle></g><rect x="3" y="17" width="24" height="24" rx="6" fill="url(#bmf)" stroke="var(--bg)" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="9" cy="23" r="2.4"></circle><circle cx="21" cy="23" r="2.4"></circle><circle cx="15" cy="29" r="2.4"></circle><circle cx="9" cy="35" r="2.4"></circle><circle cx="21" cy="35" r="2.4"></circle></g></svg>
    <h1 id="mainTitle">Which Dice League?</h1>

    <!-- Sign in: one account for both versions -->
    <form class="auth" id="auth" novalidate hidden>
      <h2 id="authTitle">Sign in</h2>
      <p class="muted" id="authNote">One account for all of Dice League: Original and 2.0.</p>
      <label class="field" id="emailField"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="field" id="passField"><span>Password</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <p class="msg" id="authMsg" role="alert" hidden></p>
      <button type="submit" class="btn" id="authBtn">Sign in</button>
      <div class="links" id="authLinks">
        <button type="button" class="linkbtn" data-mode="up">New here? Create an account</button>
        <button type="button" class="linkbtn" data-mode="reset">Forgot password?</button>
      </div>
    </form>

    <p class="who" id="who" hidden><span id="whoText"></span><button type="button" class="linkbtn" id="signOut">Sign out</button></p>
    <div class="pick" id="pick" hidden>
      <a class="ver v1" href="original/index.html">
        <svg class="die" viewBox="0 0 44 44" aria-hidden="true"><rect x="17" y="3" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#141414" stroke-width="2"></rect><g fill="#141414"><circle cx="23" cy="9" r="2.4"></circle><circle cx="29" cy="15" r="2.4"></circle><circle cx="35" cy="21" r="2.4"></circle></g><rect x="3" y="17" width="24" height="24" rx="6" fill="#141414" stroke="#FFFFFF" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="9" cy="23" r="2.4"></circle><circle cx="21" cy="23" r="2.4"></circle><circle cx="15" cy="29" r="2.4"></circle><circle cx="9" cy="35" r="2.4"></circle><circle cx="21" cy="35" r="2.4"></circle></g></svg>
        <p class="ver-name">Dice League Original</p>
        <span class="ver-go">Play →</span>
      </a>
      <a class="ver v2" href="v2/index.html">
        <svg class="die" viewBox="0 0 44 44" aria-hidden="true"><rect x="17" y="3" width="24" height="24" rx="6" fill="#1E9E4A" stroke="#1E9E4A" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="23" cy="9" r="2.4"></circle><circle cx="29" cy="15" r="2.4"></circle><circle cx="35" cy="21" r="2.4"></circle></g><rect x="3" y="17" width="24" height="24" rx="6" fill="#D2283C" stroke="#FFFFFF" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="9" cy="23" r="2.4"></circle><circle cx="21" cy="23" r="2.4"></circle><circle cx="15" cy="29" r="2.4"></circle><circle cx="9" cy="35" r="2.4"></circle><circle cx="21" cy="35" r="2.4"></circle></g></svg>
        <p class="ver-name">Dice League 2.0</p>
        <span class="ver-go">Play →</span>
      </a>
    </div>
  </main>

  <script src="original/supabase.js"></script>
  <script src="original/config.js"></script>
  <script src="account.js"></script>
  <script>
    // First page: sign in once, then pick a version. ?next=original or ?next=v2 goes straight back there.
    const $ = id => document.getElementById(id);
    const acc = window.DLAccount;
    const next = new URLSearchParams(location.search).get('next');
    const NEXT = { original: 'original/league.html', v2: 'v2/index.html' };
    const here = location.origin + location.pathname;
    let mode = 'in';

    const MODES = {
      in: { title: 'Sign in', button: 'Sign in', email: true, pass: true, links: true },
      up: { title: 'Create an account', button: 'Create account', email: true, pass: true, links: true },
      reset: { title: 'Reset your password', button: 'Send reset link', email: true, pass: false, links: true },
      newpw: { title: 'Choose a new password', button: 'Save new password', email: false, pass: true, links: false },
    };

    function say(text, tone) {
      $('authMsg').textContent = text || '';
      $('authMsg').className = 'msg' + (tone ? ' ' + tone : '');
      $('authMsg').hidden = !text;
    }

    function setMode(m) {
      mode = m;
      const d = MODES[m];
      $('authTitle').textContent = d.title;
      $('authBtn').textContent = d.button;
      $('emailField').hidden = !d.email;
      $('passField').hidden = !d.pass;
      $('authLinks').hidden = !d.links;
      $('password').autocomplete = m === 'in' ? 'current-password' : 'new-password';
      document.querySelectorAll('[data-mode]').forEach(b => {
        const target = b.dataset.mode === m ? 'in' : b.dataset.mode;
        b.dataset.target = target;
        b.textContent = target === 'in' ? 'Back to sign in' : target === 'up' ? 'New here? Create an account' : 'Forgot password?';
      });
      say('');
    }

    function friendly(err) {
      const t = String(err && err.message || err || '');
      if (/invalid login/i.test(t)) return 'That email and password don’t match an account. Check them, or create an account.';
      if (/not confirmed/i.test(t)) return 'Confirm your email first: open the link Supabase sent you, then sign in.';
      if (/already registered|already exists/i.test(t)) return 'That email already has an account. Sign in instead, or reset the password.';
      if (/password/i.test(t) && /6|short|least/i.test(t)) return 'The password needs at least 6 characters.';
      if (/fetch|network/i.test(t)) return 'Couldn’t reach the server. Check your internet connection and try again.';
      return t || 'Something went wrong. Try again.';
    }

    async function showSignedIn(user) {
      if (next && NEXT[next]) { location.replace(NEXT[next]); return; }
      $('auth').hidden = true;
      $('mainTitle').textContent = 'Which Dice League?';
      $('whoText').textContent = `Signed in as ${user.email}`;
      $('who').hidden = false;
      $('pick').hidden = false;
    }

    function showSignIn() {
      $('who').hidden = true;
      $('pick').hidden = true;
      $('mainTitle').textContent = 'Dice League';
      $('auth').hidden = false;
      setMode(acc.isRecovering() ? 'newpw' : 'in');
    }

    $('auth').addEventListener('click', e => {
      const b = e.target.closest('[data-mode]');
      if (b) setMode(b.dataset.target || b.dataset.mode);
    });

    $('auth').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('email').value.trim(), password = $('password').value;
      const d = MODES[mode];
      if (d.email && !/^\S+@\S+\.\S+$/.test(email)) { say('Enter your email address.', 'bad'); return; }
      if (d.pass && password.length < 6) { say('The password needs at least 6 characters.', 'bad'); return; }
      $('authBtn').disabled = true;
      try {
        if (mode === 'in') {
          const { data, error } = await acc.client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showSignedIn(data.user);
        } else if (mode === 'up') {
          const { data, error } = await acc.client.auth.signUp({ email, password, options: { emailRedirectTo: here } });
          if (error) throw error;
          if (data.session) showSignedIn(data.user);
          else { setMode('in'); say('Almost done: check your email and open the confirmation link, then sign in here.', 'good'); }
        } else if (mode === 'reset') {
          const { error } = await acc.client.auth.resetPasswordForEmail(email, { redirectTo: here });
          if (error) throw error;
          setMode('in');
          say('If that email has an account, a reset link is on its way. Open it on this device.', 'good');
        } else if (mode === 'newpw') {
          const { data, error } = await acc.client.auth.updateUser({ password });
          if (error) throw error;
          acc.doneRecovering();
          history.replaceState(null, '', location.pathname + location.search);
          showSignedIn(data.user);
        }
      } catch (err) {
        say(friendly(err), 'bad');
      } finally {
        $('authBtn').disabled = false;
      }
    });

    $('signOut').addEventListener('click', async () => {
      await acc.signOut();
      showSignIn();
    });

    (async () => {
      if (!acc.on) { $('pick').hidden = false; return; } // accounts not set up: just pick a version
      await new Promise(r => setTimeout(r, 0));        // let a sign-in link in the address finish first
      const user = await acc.user();
      if (user && !acc.isRecovering()) showSignedIn(user); else showSignIn();
    })();
    acc.onChange(event => { if (event === 'PASSWORD_RECOVERY') showSignIn(); });
  </script>
</body>
</html>
