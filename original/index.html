<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice League</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Archivo+Narrow:wght@600;700&display=swap">
  <style>
    /* Same colors and type as the original league app's default design, Black & White. */
    :root {
      color-scheme: light;
      --bg: #FFFFFF; --head-bg: #000000; --panel: #FFFFFF; --panel-2: #F2F2F2;
      --ink: #000000; --muted: #555555; --line: #000000;
      --accent: #000000; --accent-ink: #FFFFFF;
      --f-display: 'Archivo', system-ui, sans-serif;
      --f-body: 'Archivo', system-ui, sans-serif;
      --radius: 0;
      --gut-l: max(16px, env(safe-area-inset-left, 0px));
      --gut-r: max(16px, env(safe-area-inset-right, 0px));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body);
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
    header.top { background: var(--head-bg); border-bottom: 1px solid var(--line); }
    header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; }
    .brand h1 { margin: 0; font: 800 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: #FFFFFF; }
    .brand .sub { color: #BDBDBD !important; }
    header.top { border-bottom: 2px solid #000000; }
    .brand .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .switch { font: 600 14px var(--f-body); color: #BDBDBD; text-decoration: none; padding: 9px 12px; text-transform: uppercase; letter-spacing: .06em; }
    .switch:hover { color: #FFFFFF !important; }
    .switch:hover { color: var(--accent); }
    main .wrap { padding-block: 28px 48px; display: grid; gap: 14px; }
    .h2 { margin: 12px 0 0; font: 800 22px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
    .modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .modes-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mode {
      display: flex; flex-direction: column; gap: 10px; padding: 20px; min-height: 120px;
      background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); text-decoration: none;
    }
    .mode h3 { margin: 0; font: 800 28px/1 var(--f-display); }
    .mode .tag {
      align-self: flex-start; font: 600 12px 'Archivo Narrow', var(--f-body); text-transform: uppercase; letter-spacing: .08em;
      padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted);
    }
    a.mode:hover { border-color: var(--accent); }
    a.mode:focus-visible, .switch:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mode-live { grid-column: 1 / -1; min-height: 150px; }
    .mode-live h3 { font-size: 44px; }
    .mode-live .tag { background: var(--accent); color: var(--accent-ink); }
    .mode-soon { background: transparent; border-style: dashed; border-color: #9A9A9A; }
    .mode-soon h3 { color: var(--muted); }
    @media (max-width: 760px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } .modes-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html">
        <svg width="38" height="38" viewBox="0 0 44 44" aria-hidden="true"><rect x="17" y="3" width="24" height="24" rx="6" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="23" cy="9" r="2.4"></circle><circle cx="29" cy="15" r="2.4"></circle><circle cx="35" cy="21" r="2.4"></circle></g><rect x="3" y="17" width="24" height="24" rx="6" fill="#D33A2C" stroke="#FFFFFF" stroke-width="2"></rect><g fill="#FFFFFF"><circle cx="9" cy="23" r="2.4"></circle><circle cx="21" cy="23" r="2.4"></circle><circle cx="15" cy="29" r="2.4"></circle><circle cx="9" cy="35" r="2.4"></circle><circle cx="21" cy="35" r="2.4"></circle></g></svg>
        <div><h1>Dice League</h1><div class="sub">Original</div></div>
      </a>
      <a class="switch" href="../v2/index.html">Switch to 2.0</a>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h2 class="h2">Choose a mode</h2>
      <div class="modes">
        <a class="mode mode-live" href="league.html"><span class="tag">Open now</span><h3>1 vs 1</h3></a>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>2 vs 2</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>3 vs 3</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>4 vs 4</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>5 vs 5</h3></div>
      </div>
      <h2 class="h2">More ways to play</h2>
      <div class="modes modes-3">
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Quick Game</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Tournament</h3></div>
        <div class="mode mode-soon"><span class="tag">Coming soon</span><h3>Practice</h3></div>
      </div>
    </div>
  </main>
</body>
</html>
